<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Estadísticas de competencias · AKC</title><style>
:root{--bg:#07111f;--panel:#0d1b2d;--panel2:#11243a;--line:#213a55;--text:#f3f7fc;--muted:#9eb1c8;--blue:#54a7ff;--green:#64d8b2;--gold:#ffd166;--red:#ff7b8b}*{box-sizing:border-box}body{margin:0;overflow-x:hidden;background:radial-gradient(circle at 20% 0,#123052 0,#07111f 42%,#050b12 100%);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:1200px;margin:auto;padding:22px 18px 60px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:25px}.back{color:#cfe3fa;text-decoration:none}.eyebrow{color:#68b4ff;font-size:11px;font-weight:800;letter-spacing:.16em}.title h1{margin:5px 0;font-size:30px}.title p{margin:0;color:var(--muted)}.selector{background:linear-gradient(135deg,#10243a,#0b1828);border:1px solid var(--line);padding:20px;border-radius:18px;margin-bottom:18px}.selector label{display:block;color:var(--muted);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}.selector select{width:100%;background:#071321;color:var(--text);border:1px solid #31506f;border-radius:11px;padding:13px;font-size:16px;outline:none}.hidden{display:none!important}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:15px 0}.stat{background:#0c1a2b;border:1px solid var(--line);border-radius:15px;padding:15px}.stat small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;font-weight:800}.stat strong{display:block;font-size:24px;margin-top:5px}.grid{display:grid;grid-template-columns:1.3fr .7fr;gap:16px;min-width:0}.grid>.panel{min-width:0}.panel{background:#0c1a2b;border:1px solid var(--line);border-radius:18px;padding:18px}.panel h2{font-size:17px;margin:0 0 14px}.history{display:grid;gap:10px}.event{border:1px solid #1e3550;border-radius:14px;background:#0a1726;padding:14px;cursor:pointer}.event:hover{border-color:#397eb8;background:#0d1d31}.event-top{display:flex;align-items:flex-start;gap:10px;min-width:0}.event-top>div:first-child{min-width:0}.event .badge{display:inline-block;margin-top:7px}.chart{width:100%;min-width:0;overflow-x:auto;overflow-y:hidden;padding-bottom:8px;-webkit-overflow-scrolling:touch}.chart-scroll{width:max-content;min-width:100%}.event-name{font-weight:800}.badge{font-size:11px;padding:4px 8px;border-radius:999px;background:#173654;color:#a9d5ff;white-space:nowrap}.meta{display:flex;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin-top:8px}.scores{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin-top:12px}.score{background:#101f32;border-radius:9px;padding:7px;text-align:center}.score span{display:block;color:var(--muted);font-size:9px}.score b{font-size:13px}.aa{color:var(--green)}.detail{margin-top:16px}.detail-head{display:flex;justify-content:space-between;gap:10px;align-items:start}.close{border:1px solid #2b4967;background:#0b1929;color:#d8e9fb;border-radius:9px;padding:7px 11px;cursor:pointer}.detail-title{font-size:20px;font-weight:900}.detail-sub{color:var(--muted);font-size:13px;margin-top:4px}.notes{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:15px}.note{background:#102237;border:1px solid #203a57;border-radius:11px;padding:12px}.note span{display:block;color:var(--muted);font-size:10px}.note b{font-size:20px}.detail-results{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}.result{background:#101f32;border-radius:11px;padding:12px}.result span{display:block;color:var(--muted);font-size:10px}.result b{font-size:18px}.compare{margin-top:16px}.compare-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.compare-card{padding:12px;border-radius:11px;background:#101f32}.compare-card span{display:block;color:var(--muted);font-size:10px}.compare-card b{font-size:18px}.apparatus-box{margin-top:15px;border-top:1px solid var(--line);padding-top:15px}.apparatus-box h3{font-size:14px;margin:0 0 10px}.apparatus-sub{color:var(--muted);font-size:11px;margin-bottom:10px}.apparatus-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.apparatus-card{background:#101f32;border:1px solid #203a57;border-radius:11px;padding:11px}.apparatus-card span{display:block;color:var(--muted);font-size:10px}.apparatus-card strong{display:block;font-size:19px;margin-top:2px}.apparatus-card .tiny{line-height:1.35}.chart{margin-top:15px;width:100%;min-width:0;overflow-x:auto;overflow-y:hidden;padding-bottom:8px;-webkit-overflow-scrolling:touch}.chart-scroll{width:max-content;min-width:100%}.chart svg{height:310px;display:block;background:#091625;border:1px solid #19314b;border-radius:12px}.chart-hint{font-size:11px;color:var(--muted);margin:8px 2px 0}.empty{text-align:center;color:var(--muted);padding:45px 15px}.tiny{font-size:11px;color:var(--muted);margin-top:8px}@media(max-width:850px){.grid{grid-template-columns:1fr}.summary{grid-template-columns:repeat(2,1fr)}.scores{grid-template-columns:repeat(4,1fr)}.compare-cards{grid-template-columns:repeat(2,1fr)}.apparatus-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.summary{grid-template-columns:1fr 1fr}.notes{grid-template-columns:repeat(2,1fr)}.detail-results{grid-template-columns:1fr}.top{align-items:flex-start}.title h1{font-size:25px}}
.normbtn{border:0;border-radius:10px;padding:11px 14px;background:#54a7ff;color:#07111f;font-weight:900;font-size:12px;cursor:pointer}.normbtn:hover{background:#7fc0ff}@media print{.normbtn{display:none!important}}

.normbtn{background:#1266c9;color:#fff;border:0;border-radius:10px;padding:11px 14px;font-weight:900;font-size:12px;cursor:pointer}.normbtn:hover{background:#1b82ef}.norm-panel-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}.norm-title{font-size:21px;font-weight:900;margin:0}.norm-sub{font-size:12px;color:#667085;margin-top:4px}.norm-actions{display:flex;gap:7px;flex-wrap:wrap}.norm-actions button{border:0;border-radius:9px;padding:9px 12px;font-weight:800;font-size:11px;cursor:pointer}.norm-actions .print{background:#07111f;color:#fff}.norm-metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:14px 0}.norm-metric{border:1px solid #dfe5ec;border-radius:11px;padding:10px;background:#f8fafc}.norm-metric b{display:block;font-size:20px}.norm-metric span{font-size:9px;text-transform:uppercase;font-weight:800;color:#667085}.norm-bar{height:8px;background:#e8edf2;border-radius:99px;overflow:hidden;margin-top:7px}.norm-bar i{display:block;height:100%;border-radius:99px}.norm-table-wrap{overflow:auto;border:1px solid #dfe5ec;border-radius:11px}.norm-table{width:100%;border-collapse:collapse;min-width:650px}.norm-table th{position:static;background:#f4f7fa;color:#596579;font-size:10px;text-transform:uppercase;padding:9px;text-align:left}.norm-table td{padding:8px 9px;border-top:1px solid #edf0f3;font-size:11px;vertical-align:top}.norm-group td{background:#edf2f7;font-weight:850;text-transform:uppercase;font-size:10px}.norm-status{font-weight:850;white-space:nowrap}.norm-c{color:#087f35}.norm-ep{color:#a87800}.norm-p{color:#3657b7}.norm-na{color:#a91515}.norm-apparatus{margin-top:18px}.norm-apparatus h3{margin:0 0 8px;font-size:16px}.norm-note{font-size:10px;color:#667085;margin:8px 0 12px}.norm-level{display:inline-block;background:#eef2f6;border:1px solid #dfe5ec;border-radius:999px;padding:4px 8px;font-size:10px;font-weight:800;margin-left:6px}.hidden{display:none!important}@media(max-width:850px){.norm-metrics{grid-template-columns:repeat(2,1fr)}}@media print{body{background:#fff!important;color:#111!important}.wrap{max-width:none;padding:0}.top,.selector,#content>.summary,#content>.grid,#content>#detail,#normativosAction{display:none!important}.panel{box-shadow:none;border:0;border-radius:0}.normPanel{display:block!important}.norm-panel-head{border-bottom:2px solid #111;padding-bottom:8px}.norm-actions{display:none!important}.norm-metrics{grid-template-columns:repeat(4,1fr)}.norm-table{min-width:0}.norm-table th,.norm-table td{padding:6px 7px;font-size:9px}.norm-apparatus{break-inside:avoid-page}.norm-table-wrap{overflow:visible;border:1px solid #bbb}.norm-group td{background:#eee!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}.norm-status{font-weight:800}}</style></head><body><div class="wrap">
<div class="top"><div class="title"><div class="eyebrow">ÁGUILAS KC</div><h1>Estadísticas de competencias</h1><p>Historial individual y evolución del atleta.</p></div></div>
<section class="selector"><label for="athlete">Selecciona al atleta</label><select id="athlete"><option value="">Selecciona un atleta...</option></select><div id="athleteHint" class="tiny">Elige un atleta para ver únicamente sus competencias.</div></section>
<div id="content" class="hidden">
<div id="normativosAction" style="margin:0 0 15px;display:flex;justify-content:flex-start"><button type="button" class="normbtn" id="normBtn">VER NORMATIVOS DEL ATLETA</button></div><section id="normPanel" class="panel hidden"></section>
<section id="summary" class="summary"></section>
<div class="grid"><section class="panel"><h2>Historial de competencias</h2><div id="history" class="history"></div></section><section class="panel"><h2>Comparación del atleta</h2><div id="compare"></div></section></div>
<section id="detail" class="panel detail hidden"></section>
</div></div>
<script>
const state={rows:[],athlete:'',selected:null};
const labels={PISO:'Piso',ARZON:'Arzón',ANILLO:'Anillos',SALTO:'Salto',PARALELA:'Paralelas',FIJA:'Fija'};
const $=id=>document.getElementById(id);
function n(v){return v==null||v===''?'—':Number(v).toFixed(3).replace(/\.000$/,'').replace(/(\.\d)00$/,'$1').replace(/(\.\d\d)0$/,'$1')}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function rowsFor(){return state.rows.filter(r=>r.GIMNASTA===state.athlete)}
function render(){const rows=rowsFor();$('content').classList.toggle('hidden',!rows.length);if(!rows.length)return;
 const aa=rows.map(r=>Number(r.AA)).filter(Number.isFinite), places=rows.map(r=>Number(r.LUGAR)).filter(Number.isFinite);
 const high=Math.max(...aa),low=Math.min(...aa),best=Math.min(...places),worst=Math.max(...places);
 $('summary').innerHTML=`<div class="stat"><small>Competencias</small><strong>${rows.length}</strong></div><div class="stat"><small>AA más alto</small><strong class="aa">${n(high)}</strong></div><div class="stat"><small>Mejor lugar</small><strong>${best}°</strong></div><div class="stat"><small>Promedio AA</small><strong>${n(aa.reduce((a,b)=>a+b,0)/aa.length)}</strong></div>`;
 $('history').innerHTML=rows.map((r,i)=>`<article class="event" data-i="${i}"><div class="event-top"><div><div class="event-name">${esc(r.COPA)}</div><span class="badge">Nivel ${esc(r.NIVEL)} · Categoría ${esc(r.CAT)}</span></div></div><div class="meta"><span>AA <b class="aa">${n(r.AA)}</b></span><span>Lugar <b>${n(r.LUGAR)}°</b></span><span>Participantes <b>${n(r.PART)}</b></span></div></article>`).join('');
 document.querySelectorAll('.event').forEach(e=>e.onclick=()=>showDetail(rows[Number(e.dataset.i)]));
 const highR=rows.reduce((a,b)=>Number(b.AA)>Number(a.AA)?b:a), lowR=rows.reduce((a,b)=>Number(b.AA)<Number(a.AA)?b:a), bestR=rows.reduce((a,b)=>Number(b.LUGAR)<Number(a.LUGAR)?b:a), worstR=rows.reduce((a,b)=>Number(b.LUGAR)>Number(a.LUGAR)?b:a);
 const latest=rows[rows.length-1]; const sameLevel=rows.filter(r=>String(r.NIVEL??'').trim()===String(latest.NIVEL??'').trim()); const apparatus=['PISO','ARZON','ANILLO','SALTO','PARALELA','FIJA']; const bestApp=apparatus.map(k=>{const valid=sameLevel.filter(r=>Number.isFinite(Number(r[k]))); if(!valid.length)return {k,row:null}; return {k,row:valid.reduce((a,b)=>Number(b[k])>Number(a[k])?b:a)};}); const appHtml=bestApp.map(x=>x.row?`<div class="apparatus-card"><span>${labels[x.k]}</span><strong class="aa">${n(x.row[x.k])}</strong><div class="tiny">${esc(x.row.COPA)}</div><div class="tiny">Nivel ${esc(x.row.NIVEL)} · ${esc(x.row.CAT)}</div></div>`:`<div class="apparatus-card"><span>${labels[x.k]}</span><strong>—</strong><div class="tiny">Sin dato</div></div>`).join(''); $('compare').innerHTML=`<div class="compare-cards"><div class="compare-card"><span>AA más alto</span><b class="aa">${n(highR.AA)}</b><div class="tiny">${esc(highR.COPA)}</div></div><div class="compare-card"><span>AA más bajo</span><b>${n(lowR.AA)}</b><div class="tiny">${esc(lowR.COPA)}</div></div><div class="compare-card"><span>Mejor lugar</span><b>${n(bestR.LUGAR)}°</b><div class="tiny">${esc(bestR.COPA)}</div></div><div class="compare-card"><span>Peor lugar</span><b>${n(worstR.LUGAR)}°</b><div class="tiny">${esc(worstR.COPA)}</div></div></div><div class="apparatus-box"><h3>Mejor aparato</h3><div class="apparatus-sub">Comparado únicamente con las competencias del mismo nivel que la última competencia: <b>${esc(latest.NIVEL)}</b>.</div><div class="apparatus-grid">${appHtml}</div></div>${chart(rows)}`;
}
function chart(rows){
 const h=310,pLeft=44,pRight=28,pTop=20,pBottom=112,step=Math.max(86,Math.min(120,window.innerWidth<600?92:108));
 const w=Math.max(760,pLeft+pRight+Math.max(1,rows.length-1)*step);
 const vals=rows.map(r=>Number(r.AA));
 const min=Math.floor(Math.min(...vals)-1),max=Math.ceil(Math.max(...vals)+1);
 const x=i=>pLeft+i*((w-pLeft-pRight)/Math.max(1,rows.length-1));
 const y=v=>pTop+(max-v)/(max-min)*(h-pTop-pBottom);
 const pts=vals.map((v,i)=>`${x(i)},${y(v)}`).join(' ');
 const dots=rows.map((r,i)=>`<circle cx="${x(i)}" cy="${y(Number(r.AA))}" r="4.5" fill="#64d8b2"><title>${esc(r.COPA)} · AA ${n(r.AA)} · Lugar ${n(r.LUGAR)}° · ${n(r.PART)} participantes</title></circle>`).join('');
 const labs=rows.map((r,i)=>`<g transform="translate(${x(i)},${h-pBottom+10}) rotate(-90)"><text text-anchor="end" fill="#a9bad0" font-size="10">${esc(String(r.COPA))}</text></g>`).join('');
 const yTicks=[min,min+(max-min)/4,min+(max-min)/2,min+3*(max-min)/4,max];
 const grid=yTicks.map(v=>`<g><line x1="${pLeft}" y1="${y(v)}" x2="${w-pRight}" y2="${y(v)}" stroke="#1b3047"/><text x="${pLeft-8}" y="${y(v)+4}" text-anchor="end" fill="#8197ae" font-size="9">${n(v)}</text></g>`).join('');
 return `<div class="chart"><div class="chart-scroll"><svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="Evolución del AA por competencia">${grid}<line x1="${pLeft}" y1="${pTop}" x2="${pLeft}" y2="${h-pBottom}" stroke="#29425d"/><line x1="${pLeft}" y1="${h-pBottom}" x2="${w-pRight}" y2="${h-pBottom}" stroke="#29425d"/><polyline points="${pts}" fill="none" stroke="#64d8b2" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>${dots}${labs}<text x="10" y="14" fill="#9eb1c8" font-size="10">AA</text></svg></div><div class="chart-hint">Desliza horizontalmente para recorrer todas las competencias.</div></div>`
}
function showDetail(r){state.selected=r;$('detail').classList.remove('hidden');const notes=['PISO','ARZON','ANILLO','SALTO','PARALELA','FIJA'];$('detail').innerHTML=`<div class="detail-head"><div><div class="detail-title">${esc(r.COPA)}</div><div class="detail-sub">Nivel ${esc(r.NIVEL)} · Categoría ${esc(r.CAT)}</div></div><button class="close" onclick="$('detail').classList.add('hidden')">Cerrar</button></div><div class="notes">${notes.map(k=>`<div class="note"><span>${labels[k]}</span><b>${n(r[k])}</b></div>`).join('')}</div><div class="detail-results"><div class="result"><span>AA</span><b class="aa">${n(r.AA)}</b></div><div class="result"><span>Lugar</span><b>${n(r.LUGAR)}°</b></div><div class="result"><span>Participantes</span><b>${n(r.PART)}</b></div></div>`;$('detail').scrollIntoView({behavior:'smooth',block:'start'})}
fetch('data.json').then(r=>r.json()).then(data=>{state.rows=data;const names=[...new Set(data.map(r=>r.GIMNASTA))].sort((a,b)=>a.localeCompare(b,'es'));$('athlete').innerHTML='<option value="">Selecciona un atleta...</option>'+names.map(x=>`<option>${esc(x)}</option>`).join('');$('athlete').onchange=e=>{state.athlete=e.target.value;$('detail').classList.add('hidden');render()};$('normBtn').onclick=()=>{if(!state.athlete)return;renderNormativos(state.athlete)};}).catch(err=>{$('athleteHint').textContent='No se pudo cargar la base de estadísticas.';console.error(err)});

const NORM_APPS=[['PISO','Piso'],['ARZON','Arzón'],['ANILLOS','Anillos'],['SALTO DE CABALLO','Salto'],['BARRAS PARALELAS','Paralelas'],['BARRA FIJA','Barra fija']];
let normDb=null;
function normEsc(s){return esc(s)}
function normStatusLabel(s){return ({C:'Consolidado',EP:'En proceso',P:'Proyección',NA:'No adquirido'})[s]||'No adquirido'}
function athleteLevel(name){const rows=state.rows.filter(r=>r.GIMNASTA===name);const r=rows.find(x=>String(x.NIVEL??'').trim());return r?[String(r.NIVEL??'').trim(),String(r.CAT??'').trim()].filter(Boolean).join(' · '):''}
async function loadNormDb(){if(normDb)return normDb;try{const r=await fetch('../../normativos/database.json?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('No se pudo cargar Normativos');normDb=await r.json();return normDb}catch(e){console.error(e);return null}}
async function renderNormativos(name){const panel=$('normPanel');panel.classList.remove('hidden');panel.innerHTML='<div class="empty">Cargando normativos de '+normEsc(name)+'…</div>';const db=await loadNormDb();if(!db){panel.innerHTML='<div class="empty">No se pudo cargar la información de normativos.</div>';return}const a=(db.athletes||[]).find(x=>String(x.name).trim().toLowerCase()===String(name).trim().toLowerCase())||{};const level=[a.level,a.category].filter(Boolean).join(' · ')||athleteLevel(name);const items=db.items||[];const counts={C:0,EP:0,P:0,NA:0};items.forEach(x=>counts[x.status?.[a.name||name]||'NA']=(counts[x.status?.[a.name||name]||'NA']||0)+1);const total=Object.values(counts).reduce((a,b)=>a+b,0)||1;const logro=Math.round(counts.C/total*100);const desarrollo=Math.round((counts.C+counts.EP)/total*100);let html='<div class="norm-panel-head"><div><div class="norm-title">Normativos · '+normEsc(name)+(level?'<span class="norm-level">Nivel '+normEsc(level)+'</span>':'')+'</div><div class="norm-sub">Resumen individual · todos los aparatos · sin mostrar información de otros atletas</div></div><div class="norm-actions"><button class="print" type="button" onclick="window.print()">IMPRIMIR NORMATIVOS</button></div></div><div class="norm-metrics"><div class="norm-metric"><span>Porcentaje de logro</span><b>'+logro+'%</b><div class="norm-bar"><i style="width:'+logro+'%;background:#087f35"></i></div></div><div class="norm-metric"><span>Porcentaje de desarrollo</span><b>'+desarrollo+'%</b><div class="norm-bar"><i style="width:'+desarrollo+'%;background:#3657b7"></i></div></div><div class="norm-metric"><span>Consolidado</span><b>'+counts.C+'</b></div><div class="norm-metric"><span>En proceso · Proyección · No adquirido</span><b>'+counts.EP+' · '+counts.P+' · '+counts.NA+'</b></div></div><div class="norm-note">Logro = normativos consolidados. Desarrollo = consolidados + en proceso. Los niveles se muestran junto al atleta cuando están disponibles.</div>';
NORM_APPS.forEach(([key,label])=>{const arr=items.filter(x=>x.apparatus===key);if(!arr.length)return;html+='<section class="norm-apparatus"><h3>'+label+'</h3><div class="norm-table-wrap"><table class="norm-table"><thead><tr><th style="width:24%">Bloque</th><th>Normativo</th><th style="width:18%">Fase</th></tr></thead><tbody>';let last='';arr.forEach(x=>{const st=x.status?.[a.name||name]||'NA';if(x.classification!==last){last=x.classification;html+='<tr class="norm-group"><td colspan="3">'+normEsc(x.classification||'Sin clasificación')+'</td></tr>'}html+='<tr><td>'+normEsc(x.classification||'')+'</td><td>'+normEsc(x.element||'')+'</td><td class="norm-status norm-'+String(st).toLowerCase()+'">'+normStatusLabel(st)+'</td></tr>'});html+='</tbody></table></div></section>'});html+='</div>';panel.innerHTML=html;panel.scrollIntoView({behavior:'smooth',block:'start'});panel.classList.add('normPanel')}
</script></body></html>
