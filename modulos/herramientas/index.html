<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Herramientas del entrenador · AKC</title>
<style>
:root{--line:#213a55;--text:#f3f7fc;--muted:#9eb1c8;--blue:#54a7ff}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 20% 0,#123052 0,#07111f 42%,#050b12 100%);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
.wrap{max-width:820px;margin:auto;padding:22px 16px 60px}
.eyebrow{color:#68b4ff;font-size:11px;font-weight:800;letter-spacing:.16em}
h1{margin:6px 0 4px;font-size:28px}
p.sub{color:var(--muted);font-size:14px;margin:0 0 18px}
h2{font-size:15px;letter-spacing:.08em;color:#cfe2fa;margin:18px 0 10px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{display:flex;gap:12px;align-items:center;text-decoration:none;color:var(--text);background:linear-gradient(160deg,#10243a,#0a1727);border:1px solid var(--line);border-radius:18px;padding:18px}
.card .ico{font-size:30px}
.card b{display:block;font-size:17px}
.card small{color:var(--muted);font-size:12px}
.card.off{opacity:.5;pointer-events:none}
.card .tag{display:inline-block;margin-top:4px;font-size:10px;font-weight:800;letter-spacing:.06em;background:#2a3d55;color:#cfe2fa;border-radius:999px;padding:2px 8px}
@media(max-width:560px){.cards{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">ÁGUILAS KC · SOLO ENTRENADORES</div>
  <h1>Herramientas del entrenador</h1>
  <p class="sub">Registros rápidos para el entrenamiento.</p>
  <h2>ALL AROUND</h2>
  <div class="cards">
    <a class="card" href="allaround-obligatorios.html"><span class="ico">🤸‍♂️</span><span><b>All around de obligatorios</b><small>Niveles 3 a 6 · bonos, caídas y deducciones por aparato</small></span></a>
    <a class="card off" aria-disabled="true"><span class="ico">🏅</span><span><b>All around de libres</b><small>Niveles 7 a FIG</small><br><span class="tag">PRÓXIMAMENTE</span></span></a>
  </div>
</div>
</body>
</html>
