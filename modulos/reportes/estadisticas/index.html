<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Estadísticas de competencias · AKC</title><style>
:root{--bg:#07111f;--panel:#0d1b2d;--panel2:#11243a;--line:#213a55;--text:#f3f7fc;--muted:#9eb1c8;--blue:#54a7ff;--green:#64d8b2;--gold:#ffd166;--red:#ff7b8b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#123052 0,#07111f 42%,#050b12 100%);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:1200px;margin:auto;padding:22px 18px 60px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:25px}.back{color:#cfe3fa;text-decoration:none}.eyebrow{color:#68b4ff;font-size:11px;font-weight:800;letter-spacing:.16em}.title h1{margin:5px 0;font-size:30px}.title p{margin:0;color:var(--muted)}.selector{background:linear-gradient(135deg,#10243a,#0b1828);border:1px solid var(--line);padding:20px;border-radius:18px;margin-bottom:18px}.selector label{display:block;color:var(--muted);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}.selector select{width:100%;background:#071321;color:var(--text);border:1px solid #31506f;border-radius:11px;padding:13px;font-size:16px;outline:none}.hidden{display:none!important}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:15px 0}.stat{background:#0c1a2b;border:1px solid var(--line);border-radius:15px;padding:15px}.stat small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;font-weight:800}.stat strong{display:block;font-size:24px;margin-top:5px}.grid{display:grid;grid-template-columns:1.3fr .7fr;gap:16px}.panel{background:#0c1a2b;border:1px solid var(--line);border-radius:18px;padding:18px}.panel h2{font-size:17px;margin:0 0 14px}.history{display:grid;gap:10px}.event{border:1px solid #1e3550;border-radius:14px;background:#0a1726;padding:14px;cursor:pointer}.event:hover{border-color:#397eb8;background:#0d1d31}.event-top{display:flex;justify-content:space-between;gap:10px}.event-name{font-weight:800}.badge{font-size:11px;padding:4px 8px;border-radius:999px;background:#173654;color:#a9d5ff;white-space:nowrap}.meta{display:flex;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin-top:8px}.scores{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin-top:12px}.score{background:#101f32;border-radius:9px;padding:7px;text-align:center}.score span{display:block;color:var(--muted);font-size:9px}.score b{font-size:13px}.aa{color:var(--green)}.detail{margin-top:16px}.detail-head{display:flex;justify-content:space-between;gap:10px;align-items:start}.close{border:1px solid #2b4967;background:#0b1929;color:#d8e9fb;border-radius:9px;padding:7px 11px;cursor:pointer}.detail-title{font-size:20px;font-weight:900}.detail-sub{color:var(--muted);font-size:13px;margin-top:4px}.notes{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:15px}.note{background:#102237;border:1px solid #203a57;border-radius:11px;padding:12px}.note span{display:block;color:var(--muted);font-size:10px}.note b{font-size:20px}.detail-results{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}.result{background:#101f32;border-radius:11px;padding:12px}.result span{display:block;color:var(--muted);font-size:10px}.result b{font-size:18px}.compare{margin-top:16px}.compare-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.compare-card{padding:12px;border-radius:11px;background:#101f32}.compare-card span{display:block;color:var(--muted);font-size:10px}.compare-card b{font-size:18px}.chart{margin-top:15px;overflow-x:auto;overflow-y:hidden;padding-bottom:8px;-webkit-overflow-scrolling:touch}.chart-scroll{min-width:max-content}.chart svg{height:310px;display:block;background:#091625;border:1px solid #19314b;border-radius:12px}.chart-hint{font-size:11px;color:var(--muted);margin:8px 2px 0}.empty{text-align:center;color:var(--muted);padding:45px 15px}.tiny{font-size:11px;color:var(--muted);margin-top:8px}@media(max-width:850px){.grid{grid-template-columns:1fr}.summary{grid-template-columns:repeat(2,1fr)}.scores{grid-template-columns:repeat(4,1fr)}.compare-cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.summary{grid-template-columns:1fr 1fr}.notes{grid-template-columns:repeat(2,1fr)}.detail-results{grid-template-columns:1fr}.top{align-items:flex-start}.title h1{font-size:25px}}
</style></head><body><div class="wrap">
<div class="top"><a class="back" href="../../index.html">← Volver</a><div class="title"><div class="eyebrow">ÁGUILAS KC</div><h1>Estadísticas de competencias</h1><p>Historial individual y evolución del atleta.</p></div></div>
<section class="selector"><label for="athlete">Selecciona al atleta</label><select id="athlete"><option value="">Selecciona un atleta...</option></select><div id="athleteHint" class="tiny">Elige un atleta para ver únicamente sus competencias.</div></section>
<div id="content" class="hidden">
<section id="summary" class="summary"></section>
<div class="grid"><section class="panel"><h2>Historial de competencias</h2><div id="history" class="history"></div></section><section class="panel"><h2>Comparación del atleta</h2><div id="compare"></div></section></div>
<section id="detail" class="panel detail hidden"></section>
</div></div>
<script>
const state={rows:[],athlete:'',selected:null};
const labels={PISO:'Piso',ARZON:'Arzón',ANILLO:'Anillos',SALTO:'Salto',PARALELA:'Paralelas',FIJA:'Fija'};
const $=id=>document.getElementById(id);
function n(v){return v==null||v===''?'—':Number(v).toFixed(3).replace(/\.000$/,'').replace(/(\.\d)00$/,'$1').replace(/(\.\d\d)0$/,'$1')}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function rowsFor(){return state.rows.filter(r=>r.GIMNASTA===state.athlete)}
function render(){const rows=rowsFor();$('content').classList.toggle('hidden',!rows.length);if(!rows.length)return;
 const aa=rows.map(r=>Number(r.AA)).filter(Number.isFinite), places=rows.map(r=>Number(r.LUGAR)).filter(Number.isFinite);
 const high=Math.max(...aa),low=Math.min(...aa),best=Math.min(...places),worst=Math.max(...places);
 $('summary').innerHTML=`<div class="stat"><small>Competencias</small><strong>${rows.length}</strong></div><div class="stat"><small>AA más alto</small><strong class="aa">${n(high)}</strong></div><div class="stat"><small>Mejor lugar</small><strong>${best}°</strong></div><div class="stat"><small>Promedio AA</small><strong>${n(aa.reduce((a,b)=>a+b,0)/aa.length)}</strong></div>`;
 $('history').innerHTML=rows.map((r,i)=>`<article class="event" data-i="${i}"><div class="event-top"><div class="event-name">${esc(r.COPA)}</div><span class="badge">${esc(r.NIVEL)} · ${esc(r.CAT)}</span></div><div class="meta"><span>AA <b class="aa">${n(r.AA)}</b></span><span>Lugar <b>${n(r.LUGAR)}°</b></span><span>Participantes <b>${n(r.PART)}</b></span></div></article>`).join('');
 document.querySelectorAll('.event').forEach(e=>e.onclick=()=>showDetail(rows[Number(e.dataset.i)]));
 const highR=rows.reduce((a,b)=>Number(b.AA)>Number(a.AA)?b:a), lowR=rows.reduce((a,b)=>Number(b.AA)<Number(a.AA)?b:a), bestR=rows.reduce((a,b)=>Number(b.LUGAR)<Number(a.LUGAR)?b:a), worstR=rows.reduce((a,b)=>Number(b.LUGAR)>Number(a.LUGAR)?b:a);
 $('compare').innerHTML=`<div class="compare-cards"><div class="compare-card"><span>AA más alto</span><b class="aa">${n(highR.AA)}</b><div class="tiny">${esc(highR.COPA)}</div></div><div class="compare-card"><span>AA más bajo</span><b>${n(lowR.AA)}</b><div class="tiny">${esc(lowR.COPA)}</div></div><div class="compare-card"><span>Mejor lugar</span><b>${n(bestR.LUGAR)}°</b><div class="tiny">${esc(bestR.COPA)}</div></div><div class="compare-card"><span>Peor lugar</span><b>${n(worstR.LUGAR)}°</b><div class="tiny">${esc(worstR.COPA)}</div></div></div>${chart(rows)}`;
}
function chart(rows){
 const h=310,pLeft=44,pRight=28,pTop=20,pBottom=112,step=Math.max(86,Math.min(120,window.innerWidth<600?92:108));
 const w=Math.max(760,pLeft+pRight+Math.max(1,rows.length-1)*step);
 const vals=rows.map(r=>Number(r.AA));
 const min=Math.floor(Math.min(...vals)-1),max=Math.ceil(Math.max(...vals)+1);
 const x=i=>pLeft+i*((w-pLeft-pRight)/Math.max(1,rows.length-1));
 const y=v=>pTop+(max-v)/(max-min)*(h-pTop-pBottom);
 const pts=vals.map((v,i)=>`${x(i)},${y(v)}`).join(' ');
 const dots=rows.map((r,i)=>`<circle cx="${x(i)}" cy="${y(Number(r.AA))}" r="4.5" fill="#64d8b2"><title>${esc(r.COPA)} · AA ${n(r.AA)} · Lugar ${n(r.LUGAR)}° · ${n(r.PART)} participantes</title></circle>`).join('');
 const labs=rows.map((r,i)=>`<g transform="translate(${x(i)},${h-pBottom+10}) rotate(-90)"><text text-anchor="end" fill="#a9bad0" font-size="10">${esc(String(r.COPA))}</text></g>`).join('');
 const yTicks=[min,min+(max-min)/4,min+(max-min)/2,min+3*(max-min)/4,max];
 const grid=yTicks.map(v=>`<g><line x1="${pLeft}" y1="${y(v)}" x2="${w-pRight}" y2="${y(v)}" stroke="#1b3047"/><text x="${pLeft-8}" y="${y(v)+4}" text-anchor="end" fill="#8197ae" font-size="9">${n(v)}</text></g>`).join('');
 return `<div class="chart"><div class="chart-scroll"><svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="Evolución del AA por competencia">${grid}<line x1="${pLeft}" y1="${pTop}" x2="${pLeft}" y2="${h-pBottom}" stroke="#29425d"/><line x1="${pLeft}" y1="${h-pBottom}" x2="${w-pRight}" y2="${h-pBottom}" stroke="#29425d"/><polyline points="${pts}" fill="none" stroke="#64d8b2" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>${dots}${labs}<text x="10" y="14" fill="#9eb1c8" font-size="10">AA</text></svg></div><div class="chart-hint">Desliza horizontalmente para recorrer todas las competencias.</div></div>`
}
function showDetail(r){state.selected=r;$('detail').classList.remove('hidden');const notes=['PISO','ARZON','ANILLO','SALTO','PARALELA','FIJA'];$('detail').innerHTML=`<div class="detail-head"><div><div class="detail-title">${esc(r.COPA)}</div><div class="detail-sub">Nivel ${esc(r.NIVEL)} · Categoría ${esc(r.CAT)}</div></div><button class="close" onclick="$('detail').classList.add('hidden')">Cerrar</button></div><div class="notes">${notes.map(k=>`<div class="note"><span>${labels[k]}</span><b>${n(r[k])}</b></div>`).join('')}</div><div class="detail-results"><div class="result"><span>AA</span><b class="aa">${n(r.AA)}</b></div><div class="result"><span>Lugar</span><b>${n(r.LUGAR)}°</b></div><div class="result"><span>Participantes</span><b>${n(r.PART)}</b></div></div>`;$('detail').scrollIntoView({behavior:'smooth',block:'start'})}
fetch('data.json').then(r=>r.json()).then(data=>{state.rows=data;const names=[...new Set(data.map(r=>r.GIMNASTA))].sort((a,b)=>a.localeCompare(b,'es'));$('athlete').innerHTML='<option value="">Selecciona un atleta...</option>'+names.map(x=>`<option>${esc(x)}</option>`).join('');$('athlete').onchange=e=>{state.athlete=e.target.value;$('detail').classList.add('hidden');render()}}).catch(err=>{$('athleteHint').textContent='No se pudo cargar la base de estadísticas.';console.error(err)});
</script></body></html>
