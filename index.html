<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Águilas Kids Center · Plataforma AKC</title>
  <link rel="stylesheet" href="style.css?v=6">
  <link rel="stylesheet" href="menu-tarjetas.css?v=4">
</head>
<body>
<div id="app">

  <div id="home" class="screen active">
    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>
    <div class="eagle-watermark" aria-hidden="true"></div>

    <header class="header">
      <div class="brand-mark">
        <img src="modulos/fuerza/logo-transparent.png" class="logo" alt="Águilas KC">
      </div>
      <div class="brand-copy">
        <div class="brand-kicker">ÁGUILAS KC</div>
        <h1>KIDS CENTER</h1>
        <div class="brand-subtitle">GIMNASIA ARTÍSTICA VARONIL</div>
      </div>
    </header>

    <div class="section-label"><span>PLATAFORMA DE ENTRENAMIENTO</span><i></i></div>

    <main class="menu tarjetas">
      <button type="button" class="btn mvp" onclick="openScreen('mvp')"><span class="icon"><span aria-hidden="true">🏆</span></span><span class="btn-copy"><strong>MVP</strong><small>¿Quién fue el mejor de la semana?</small></span><span class="arrow">›</span></button>
      <button type="button" class="btn plan-anual" onclick="openScreen('planAnual')"><span class="icon"><span aria-hidden="true">📅</span></span><span class="btn-copy"><strong>PLAN ANUAL</strong><small>Todo el año de entrenamiento</small></span><span class="arrow">›</span></button>
      <button type="button" class="btn fuerza" onclick="openScreen('fuerza')"><span class="icon"><span aria-hidden="true">💪</span></span><span class="btn-copy"><strong>FUERZA</strong><small>Tus ejercicios de fuerza</small></span><span class="arrow">›</span></button>
      <button type="button" class="btn fig" onclick="openScreen('FuerzaFIG')"><span class="icon"><span aria-hidden="true">🏋️‍♂️</span></span><span class="btn-copy"><strong>FUERZA FIG</strong><small>Fuerza para el nivel FIG</small></span><span class="arrow">›</span></button>
      <button type="button" class="btn cargas" onclick="openScreen('cargas')"><span class="icon"><span aria-hidden="true">📊</span></span><span class="btn-copy"><strong>CARGA SEMANAL</strong><small>Cuánto entrenamos cada semana</small></span><span class="arrow">›</span></button>
      <button type="button" class="btn trabajo" onclick="openScreen('trabajo')"><span class="icon"><span aria-hidden="true">🎯</span></span><span class="btn-copy"><strong>TRABAJO EN DESARROLLO DEL ATLETA</strong><small>Lo que estás aprendiendo</small></span><span class="arrow">›</span></button>
      <button type="button" class="btn SISTEMAS" onclick="openScreen('SISTEMAS')"><span class="icon"><span aria-hidden="true">⚙️</span></span><span class="btn-copy"><strong>SISTEMAS</strong><small>Cómo nos organizamos</small></span><span class="arrow">›</span></button>
      <button type="button" class="btn rutinas" onclick="openScreen('rutinas')"><span class="icon"><span aria-hidden="true">🤸‍♂️</span></span><span class="btn-copy"><strong>RUTINAS</strong><small>Tus rutinas por aparato</small></span><span class="arrow">›</span></button>
      <button type="button" class="btn basicos" onclick="openScreen('basicos')"><span class="icon"><span aria-hidden="true">🧱</span></span><span class="btn-copy"><strong>BÁSICOS</strong><small>Los fundamentos de AKC</small></span><span class="arrow">›</span></button>
      <button type="button" class="btn normativos" onclick="openScreen('normativos')"><span class="icon"><span aria-hidden="true">✅</span></span><span class="btn-copy"><strong>NORMATIVOS</strong><small>Tus avances técnicos</small></span><span class="arrow">›</span></button>
      <button type="button" class="btn reportes" onclick="openScreen('reportes')"><span class="icon"><span aria-hidden="true">📈</span></span><span class="btn-copy"><strong>REPORTES</strong><small>Estadísticas y resultados</small></span><span class="arrow">›</span></button>
      <button type="button" class="btn redes" onclick="openScreen('redes')"><span class="logos-redes" aria-hidden="true"><svg class="ig" viewBox="0 0 48 48"><defs><radialGradient id="igG" cx="30%" cy="107%" r="150%"><stop offset="0" stop-color="#fdf497"/><stop offset=".05" stop-color="#fdf497"/><stop offset=".45" stop-color="#fd5949"/><stop offset=".6" stop-color="#d6249f"/><stop offset=".9" stop-color="#285AEB"/></radialGradient></defs><rect width="48" height="48" rx="12" fill="url(#igG)"/><rect x="11" y="11" width="26" height="26" rx="8" fill="none" stroke="#fff" stroke-width="3.2"/><circle cx="24" cy="24" r="6.3" fill="none" stroke="#fff" stroke-width="3.2"/><circle cx="31.6" cy="16.4" r="2" fill="#fff"/></svg><svg class="tt" viewBox="0 0 48 48"><rect width="48" height="48" rx="12" fill="#000"/><g transform="translate(9 8)"><path d="M21.5 0h-5.6v21.6a4.9 4.9 0 1 1-4.9-4.9c.5 0 1 .1 1.4.2v-5.7a10.6 10.6 0 1 0 9.1 10.4V10.6a12.3 12.3 0 0 0 7.2 2.3V7.3A7.2 7.2 0 0 1 21.5 0Z" fill="#25F4EE" transform="translate(-1.4 -1.2)"/><path d="M21.5 0h-5.6v21.6a4.9 4.9 0 1 1-4.9-4.9c.5 0 1 .1 1.4.2v-5.7a10.6 10.6 0 1 0 9.1 10.4V10.6a12.3 12.3 0 0 0 7.2 2.3V7.3A7.2 7.2 0 0 1 21.5 0Z" fill="#FE2C55" transform="translate(1.2 1.1)"/><path d="M21.5 0h-5.6v21.6a4.9 4.9 0 1 1-4.9-4.9c.5 0 1 .1 1.4.2v-5.7a10.6 10.6 0 1 0 9.1 10.4V10.6a12.3 12.3 0 0 0 7.2 2.3V7.3A7.2 7.2 0 0 1 21.5 0Z" fill="#fff"/></g></svg><svg class="yt" viewBox="0 0 48 48"><rect width="48" height="48" rx="12" fill="#fff"/><rect x="6" y="13" width="36" height="22" rx="7" fill="#FF0000"/><path d="M21 18.5v11l9.5-5.5z" fill="#fff"/></svg></span><span class="btn-copy"><strong>GIMNASIA EN REDES</strong><small>Videos para divertirte</small></span><span class="arrow">›</span></button>
      <button type="button" class="btn drive" onclick="openScreen('drive')"><span class="icon"><span aria-hidden="true">📁</span></span><span class="btn-copy"><strong>ARCHIVOS</strong><small>Documentos del equipo</small></span><span class="arrow">›</span></button>
      <button type="button" class="btn calendar-btn" onclick="openScreen('calendar')"><span class="icon"><span aria-hidden="true">🗓️</span></span><span class="btn-copy"><strong>CALENDARIO</strong><small>Competencias y eventos</small></span><span class="arrow">›</span></button>
    </main>

    <footer class="footer">ÁGUILAS DE KIDS CENTER <span>•</span> SISTEMA AKC</footer>
  </div>

  <div id="viewerScreen" class="screen viewer-screen">
    <button type="button" class="back" onclick="goHome()">← Volver</button>
    <div class="viewer-wrap">
      <iframe id="viewerFrame" title="Módulo AKC" allow="fullscreen; clipboard-read; clipboard-write"></iframe>
    </div>
  </div>

  <div id="calendarScreen" class="screen viewer-screen">
    <button type="button" class="back" onclick="goHome()">← Volver</button>
    <div class="viewer-wrap">
      <iframe src="about:blank" title="Calendario AKC" allowfullscreen></iframe>
    </div>
  </div>

  <div id="passwordModal" class="password-overlay" aria-hidden="true">
    <div class="password-box" role="dialog" aria-modal="true" aria-labelledby="passwordTitle">
      <div class="modal-logo"><img src="logo.png" alt="Águilas KC"></div>
      <h2 id="passwordTitle">NORMATIVOS</h2>
      <p>Ingresa la contraseña para continuar.</p>
      <input id="passwordInput" type="password" autocomplete="off" inputmode="text" placeholder="Contraseña">
      <div id="passwordError" class="password-error"></div>
      <div class="password-actions">
        <button type="button" class="modal-btn cancel" onclick="closePassword()">Cancelar</button>
        <button type="button" class="modal-btn enter" onclick="checkPassword()">Entrar</button>
      </div>
    </div>
  </div>

</div>
<script src="script.js?v=7"></script>
<script src="menu-vistas.js?v=2"></script>
</body>
</html>
