<style>
:root{--navy:#071b35;--blue:#1267d8;--cyan:#11b9c8;--sky:#eaf4ff;--gold:#f3b72f;--green:#079669;--red:#d64b55;--purple:#7057d9;--ink:#142238;--muted:#66758a;--line:#dfe7f0;--bg:#f3f6fa;--white:#fff}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial;background:var(--bg);color:var(--ink)}

.wrap{max-width:1160px;margin:24px auto;padding:0 16px}.topline{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px}.eyebrow{text-transform:uppercase;letter-spacing:.13em;color:var(--blue);font-size:11px;font-weight:950}.title{margin:4px 0 5px;font-size:30px}.sub{color:var(--muted);font-size:13px}.upload{border:1px solid #ccd8e6;background:#fff;color:#40516a;border-radius:10px;padding:8px 11px;font-weight:800;font-size:12px;cursor:pointer;box-shadow:0 2px 7px #10243b08}.upload:hover{border-color:#8eb7e8;color:var(--blue)}

.back{margin-bottom:13px}.btn{border:0;border-radius:10px;padding:9px 13px;font-weight:850;cursor:pointer}.btn.alt{background:#fff;border:1px solid var(--line);color:#43536a}.hero{background:#fff;border:1px solid var(--line);border-radius:20px;padding:21px;box-shadow:0 9px 26px #10243b0a;margin-bottom:15px}.hero h1{margin:4px 0 5px;font-size:29px}.hero p{margin:0;color:var(--muted);font-size:13px}
.selectbox{display:flex;align-items:center;gap:10px;margin-top:18px}.selectbox label{font-size:12px;font-weight:900;color:#53647a}.selectbox select{flex:1;min-width:0;border:1px solid #ccd8e6;border-radius:12px;background:#fff;padding:12px 13px;font-weight:800;color:var(--ink);font-size:14px;outline:none}.selectbox select:focus{border-color:var(--blue);box-shadow:0 0 0 3px #1267d812}
.report{overflow:hidden}.reportTop{padding:20px;background:linear-gradient(120deg,#fff,#f5faff)}.athName{font-size:26px;font-weight:950;margin:3px 0}.athMeta{font-size:12px;color:var(--muted)}.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.badge{padding:7px 10px;border-radius:9px;font-size:11px;font-weight:900}.bblue{background:#e8f2ff;color:#1261c9}.bgreen{background:#e6f8f2;color:#087b58}.bgold{background:#fff5d9;color:#966b00}.bpurple{background:#eeeaff;color:#5945ba}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:0 20px 20px;background:linear-gradient(120deg,#fff,#f5faff)}.stat{border-radius:14px;padding:13px;border:1px solid var(--line);background:#fff}.stat:nth-child(1){border-top:4px solid var(--blue)}.stat:nth-child(2){border-top:4px solid var(--cyan)}.stat:nth-child(3){border-top:4px solid var(--gold)}.stat:nth-child(4){border-top:4px solid var(--green)}.stat small{display:block;color:var(--muted);font-weight:800;font-size:10px;text-transform:uppercase}.stat strong{display:block;font-size:20px;margin-top:5px}
.section{margin-top:15px;padding:18px}.section h2{margin:0 0 4px;font-size:18px}.section p{margin:0 0 13px;color:var(--muted);font-size:12px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:14px}table{border-collapse:collapse;width:100%;min-width:760px}th,td{padding:11px 10px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}th{background:#edf4fb;color:#53647a;font-size:10px;text-transform:uppercase;letter-spacing:.06em}th:first-child,td:first-child{text-align:left}td:first-child{font-weight:900}.rowPiso td:first-child{border-left:4px solid #3b82f6}.rowArzon td:first-child{border-left:4px solid #8b5cf6}.rowAnillos td:first-child{border-left:4px solid #06b6d4}.rowSalto td:first-child{border-left:4px solid #f59e0b}.rowParalelas td:first-child{border-left:4px solid #10b981}.rowBarra td:first-child{border-left:4px solid #ef4444}.npd{font-weight:900;color:#5c6574}.npReal{font-weight:950;color:#1267d8}.nf{font-weight:950;color:#087b58}.ded{font-weight:900;color:#b56a00}.eff{font-weight:950;color:#087b58}.no{color:var(--red);font-weight:950;background:#fff3f4}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-top:14px}.sum{padding:14px;border-radius:14px}.sum:nth-child(1){background:#eaf4ff}.sum:nth-child(2){background:#e8faf5}.sum:nth-child(3){background:#fff6df}.sum small{display:block;font-size:10px;font-weight:900;color:#5b6980;text-transform:uppercase}.sum b{display:block;font-size:18px;margin-top:4px}
.notice{margin-top:12px;background:#f7f9fc;border:1px solid var(--line);border-radius:12px;padding:11px 13px;color:#5f6e82;font-size:11px}.danger{background:#fff4f4;border-color:#f1c6c9;color:#9f3b43}
@media(max-width:700px){.topline{align-items:flex-start}.title{font-size:25px}.stats{grid-template-columns:repeat(2,1fr);padding:0 13px 14px}.reportTop{padding:16px}.section{padding:14px}.summary{grid-template-columns:1fr}.selectbox{align-items:stretch;flex-direction:column}.wrap{padding:0 11px;margin-top:17px}}

<body>
<header class="header"><div class="brand"><div class="logo">AKC</div><div><b>Águilas Kids Center</b><span>RESULTADOS · HISTORIAL DE COMPETENCIAS</span></div></div></header>
<main class="wrap"><div id="app"></div></main>
<script>
const STORAGE='AKC_RESULTADOS_HISTORIAL_V3';
const APP=['Piso','Arzón','Anillos','Salto','Paralelas','Barra Fija'];
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const num=v=>{if(v===null||v===undefined||v==='')return 0;let n=Number(String(v).replace(',','.'));return Number.isFinite(n)?n:0};
const fmt=v=>(v===null||v===undefined||v===''||Number.isNaN(Number(v)))?'—':Number(v).toFixed(3);
const pct=v=>(v===null||v===undefined||Number.isNaN(Number(v)))?'—':(Number(v)*100).toFixed(2)+'%';
const norm=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/[^A-Z0-9]+/g,' ').trim();
const presented=x=>num(x.nf)>0;
let EVENTS={};
function save(){try{localStorage.setItem(STORAGE,JSON.stringify(EVENTS))}catch(e){console.warn(e)}}
function load(){try{EVENTS=JSON.parse(localStorage.getItem(STORAGE)||'{}')||{}}catch(e){EVENTS={}}}
function calc(a){const rows=a.apparatus.map((x,i)=>{const p=presented(x),d=a.desired?.[i];const ded=p?num(x.np)-num(x.nf):null;const pc=p&&num(x.np)>0?num(x.nf)/num(x.np)*100:null;return {...x,desired:d,presented:p,ded,p:pc}});const vals=rows.filter(x=>x.presented&&x.p!==null);const eff=vals.length?vals.reduce((s,x)=>s+x.p,0)/vals.length/100:0;const aa=rows.filter(x=>x.presented).reduce((s,x)=>s+num(x.nf),0);return{rows,eff,aa}}
function recomputeRanks(event){const e=event.athletes.map(a=>({a,c:calc(a)})).filter(x=>x.c.aa>0).sort((a,b)=>b.c.aa-a.c.aa);let last=null,rank=0;e.forEach((x,i)=>{if(last===null||Math.abs(x.c.aa-last)>0.000001){rank=i+1;last=x.c.aa}x.a.clubRank=rank})}
function home(){const list=Object.values(EVENTS).sort((a,b)=>new Date(b.loadedAt||0)-new Date(a.loadedAt||0));$('app').innerHTML=`<div class="topline"><div><div class="eyebrow">Módulo de resultados</div><div class="title">Competencias</div><div class="sub">Historial de resultados AKC</div></div><button class="upload" onclick="$('file').click()">＋ Subir Excel</button><input id="file" class="hidden" type="file" accept=".xlsx,.xls" onchange="importExcel(this.files[0])"></div>${list.length?`<div class="grid">${list.map(e=>`<div class="card event" onclick="eventView('${esc(e.id)}')"><div class="eventhead"><div class="eventicon">🏆</div><span class="count">${e.athletes.length} atletas</span></div><h2>${esc(e.event)}</h2><p>${e.sheets?e.sheets+' hojas leídas · ':''}Ranking interno AKC</p></div>`).join('')}</div>`:`<div class="card empty">Todavía no hay competencias cargadas.<br>Usa <b>＋ Subir Excel</b> para agregar la primera.</div>`}`}
function eventView(id,selected){const e=EVENTS[id];if(!e)return home();recomputeRanks(e);const names=e.athletes.map(a=>a.name).sort((a,b)=>a.localeCompare(b,'es'));const chosen=selected&&e.athletes.some(a=>a.name===selected)?selected:'';$('app').innerHTML=`<div class="back"><button class="btn alt" onclick="home()">← Competencias</button></div><section class="hero"><div class="eyebrow">Competencia</div><h1>🏆 ${esc(e.event)}</h1><p>${e.athletes.length} atletas detectados en el archivo · El ranking es exclusivamente AKC.</p><div class="selectbox"><label>ATLETA</label><select onchange="detail('${esc(id)}',this.value)"><option value="">Selecciona un atleta...</option>${names.map(n=>`<option value="${esc(n)}" ${n===chosen?'selected':''}>${esc(n)}</option>`).join('')}</select></div></section>${chosen?detailHtml(e,chosen):`<section class="card empty">Selecciona un atleta para abrir su reporte completo.</section>`}`}
function detail(id,name){const e=EVENTS[id];if(!e)return;eventView(id,name)}
function detailHtml(e,name){const a=e.athletes.find(x=>x.name===name);if(!a)return '';const c=calc(a),diff=a.objective!==null&&a.objective!==undefined?c.aa-num(a.objective):null;const participants=e.athletes.filter(x=>calc(x).aa>0).length;const presentedCount=c.rows.filter(x=>x.presented).length;return `<section class="card report"><div class="reportTop"><div class="eyebrow">Reporte del atleta</div><div class="athName">${esc(a.name)}</div><div class="athMeta">Nivel ${esc(a.level??'—')}${a.category?' · Categoría '+esc(a.category):''}${a.routine?' · Rutina '+esc(a.routine):''}</div><div class="badges"><span class="badge bblue">${esc(e.event)}</span><span class="badge bgreen">${presentedCount} / ${APP.length} aparatos presentados</span>${a.clubRank?`<span class="badge bgold">Ranking AKC ${a.clubRank}.º de ${participants}</span>`:''}${a.excelPlace?`<span class="badge bpurple">Lugar oficial: ${esc(a.excelPlace)}</span>`:''}</div></div><div class="stats"><div class="stat"><small>Objetivo AA</small><strong>${fmt(a.objective)}</strong></div><div class="stat"><small>All Around</small><strong>${fmt(c.aa)}</strong></div><div class="stat"><small>Diferencia</small><strong>${diff===null?'—':fmt(diff)}</strong></div><div class="stat"><small>Efectividad general</small><strong>${pct(c.eff)}</strong></div></div></section><section class="card section"><h2>Resultados por aparato</h2><p>La NP deseada se toma de la hoja de notas de partida cuando existe. Si NF = 0, el aparato aparece como <b>NO PRESENTÓ</b> y no entra en la efectividad.</p><div class="tablewrap"><table><thead><tr><th>Aparato</th><th>NP deseada</th><th>NP real</th><th>NF</th><th>DED</th><th>Efectividad</th></tr></thead><tbody>${c.rows.map((x,i)=>{const cls='row'+['Piso','Arzon','Anillos','Salto','Paralelas','Barra'][i];return x.presented?`<tr class="${cls}"><td>${esc(x.name)}</td><td class="npd">${fmt(x.desired)}</td><td class="npReal">${fmt(x.np)}</td><td class="nf">${fmt(x.nf)}</td><td class="ded">${fmt(x.ded)}</td><td class="eff">${x.p.toFixed(2)}%</td></tr>`:`<tr class="${cls}"><td>${esc(x.name)}</td><td class="npd">${fmt(x.desired)}</td><td class="npReal">${fmt(x.np)}</td><td class="no">NO PRESENTÓ</td><td>—</td><td>—</td></tr>`}).join('')}</tbody></table></div><div class="summary"><div class="sum"><small>Aparatos presentados</small><b>${presentedCount} de ${APP.length}</b></div><div class="sum"><small>Promedio de efectividad</small><b>${pct(c.eff)}</b></div><div class="sum"><small>Ranking interno AKC</small><b>${a.clubRank?a.clubRank+'.º de '+participants:'No clasifica'}</b></div></div><div class="notice">El lugar oficial del Excel se conserva como referencia, pero <b>no se usa para calcular el ranking AKC</b>.</div></section>`}
function findHeader(rows){for(let r=0;r<Math.min(rows.length,15);r++){const vals=(rows[r]||[]).map(norm);if(vals.some(x=>x==='NOMBRE')&&vals.some(x=>x==='NIVEL'))return r}return -1}
function parseMain(rows){const hr=findHeader(rows);if(hr<0)throw new Error('No encontré la fila de encabezados con NOMBRE y NIVEL.');const h1=rows[hr]||[],h2=rows[hr+1]||[];const nameCol=h1.findIndex(v=>norm(v)==='NOMBRE'),levelCol=h1.findIndex(v=>norm(v)==='NIVEL'),objCol=h1.findIndex(v=>norm(v)==='OBJETIVO'),difCol=h1.findIndex(v=>norm(v)==='DIF');const apparatus=[];APP.forEach(name=>{const col=h1.findIndex(v=>norm(v)===norm(name));if(col>=0){let np=col,nf=col+1;const n1=norm(h2[np]),n2=norm(h2[nf]);if(n1!=='NP'){const a=h1.findIndex((v,i)=>norm(v)===norm(name));np=a}if(n2!=='NF')nf=np+1;apparatus.push({name,np,nf})}});if(apparatus.length<4)throw new Error('No encontré suficientes columnas de aparatos en el Excel.');let aaCol=h1.findIndex(v=>norm(v)==='AA'),effCol=h1.findIndex(v=>norm(v).includes('PORCENTAJE DE EFECTIVIDAD')),placeCol=h1.findIndex(v=>norm(v)==='LUGAR'),routineCol=h1.findIndex(v=>norm(v)==='RUTINAS');const athletes=[];for(let r=hr+2;r<rows.length;r++){const row=rows[r]||[];const name=row[nameCol];if(!name||norm(name)==='NOMBRE')continue;const level=row[levelCol];if(level===null||level===undefined||level==='')continue;const aps=apparatus.map(x=>({name:x.name,np:row[x.np],nf:row[x.nf]}));if(!aps.some(x=>x.np!==null&&x.np!==undefined&&x.np!==''||x.nf!==null&&x.nf!==undefined&&x.nf!==''))continue;athletes.push({name:String(name).trim(),level:level,objective:objCol>=0?row[objCol]:null,dif:difCol>=0?row[difCol]:null,aa:aaCol>=0?row[aaCol]:null,effectiveness:effCol>=0?row[effCol]:null,excelPlace:placeCol>=0?row[placeCol]:null,routine:routineCol>=0?row[routineCol]:null,apparatus:aps})}return athletes}
function parseDesired(rows){let st=-1;for(let r=0;r<rows.length;r++){if((rows[r]||[]).some(v=>norm(v).includes('NOTAS DE PARTIDA DESEADAS'))){st=r;break}}if(st<0)return{};const out={};for(let r=st+1;r<rows.length;r++){const row=rows[r]||[];let name=row[1]??row[0];if(!name||typeof name!=='string')continue;const vals=row.slice(2,8);if(vals.some(v=>v!==null&&v!==undefined&&v!==''))out[norm(name)]=vals}return out}
function desiredFor(name,des){const k=norm(name);if(des[k])return des[k];const key=Object.keys(des).find(x=>x===k||x.startsWith(k)||k.startsWith(x)||x.includes(k)||k.includes(x));return key?des[key]:null}
async function importExcel(file){if(!file)return;try{const buf=await file.arrayBuffer();const wb=XLSX.read(buf,{type:'array',cellDates:false});let mainSheet=null,mainRows=null;for(const sn of wb.SheetNames){const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:null,raw:true});if(findHeader(rows)>=0){mainSheet=sn;mainRows=rows;break}}if(!mainRows)throw new Error('No encontré una hoja de resultados con NOMBRE y NIVEL.');const athletes=parseMain(mainRows);const allRows=wb.SheetNames.map(sn=>({sn,rows:XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:null,raw:true})}));let desired={};for(const s of allRows){const d=parseDesired(s.rows);if(Object.keys(d).length){desired={...desired,...d}}}athletes.forEach(a=>a.desired=desiredFor(a.name,desired));let event='';for(const s of allRows){const v=s.rows?.[0]?.[0];if(v!==null&&v!==undefined&&String(v).trim()){event=String(v).trim();break}}if(!event)event=file.name.replace(/\.xlsx?$/i,'');const id=norm(event).replace(/\s+/g,'_')||('EVENTO_'+Date.now());EVENTS[id]={id,event,athletes,sheets:wb.SheetNames.length,loadedAt:new Date().toISOString(),source:file.name};save();home();alert('Excel agregado correctamente: '+event+'\n\nSe conservaron las competencias anteriores.');}catch(e){console.error(e);alert('No se pudo leer el Excel completo.\n\n'+e.message)}}
load();
