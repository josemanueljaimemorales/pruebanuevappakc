<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gimnasia en redes · AKC</title>
<link rel="stylesheet" href="style.css?v=5">
</head>
<body>

<div class="bg-eagle" aria-hidden="true"></div>

<nav class="pestanas" aria-label="Secciones">
  <button type="button" id="tabVideos" aria-selected="true">Videos</button>
  <button type="button" id="tabPerfiles" aria-selected="false">Perfiles</button>
  <button type="button" class="mas" id="btnVideo" aria-label="Agregar video">+ Video</button>
</nav>

<main class="feed" id="feed" aria-label="Videos"></main>

<div class="app-shell oculto" id="vistaPerfiles">
  <header class="header">
    <div class="eyebrow"><span data-cliente-name></span> · Gimnasia artística varonil</div>
    <h1>Diviértete viendo gimnasia<span>Perfiles de gimnastas en redes</span></h1>
  </header>

  <div class="barra">
    <div class="filtros" id="filtros" role="tablist" aria-label="Red social"></div>
    <button type="button" class="agregar" id="btnAgregar">+ Agregar perfil</button>
  </div>
  <div class="estado" id="estado" role="status"></div>
  <main class="lista" id="lista"></main>
  <p class="nota-pie">Toca una publicación o un video para verlo en grande en su red.</p>
</div>

<div class="modal oculto" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitulo">
  <form class="caja" id="form" autocomplete="off">
    <h2 id="modalTitulo">Agregar perfil</h2>
    <label>Enlace o usuario
      <input id="fEnlace" required placeholder="https://www.instagram.com/usuario o @usuario" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" data-1p-ignore="true" data-lpignore="true" data-bwignore="true" data-form-type="other">
    </label>
    <label>Red social
      <select id="fRed">
        <option value="instagram">Instagram</option>
        <option value="tiktok">TikTok</option>
        <option value="youtube">YouTube</option>
      </select>
    </label>
    <label>Nombre que se muestra (se pone solo; puedes corregirlo)
      <input id="fTitulo" maxlength="60" placeholder="Se llena al pegar el enlace" autocomplete="off" autocorrect="off" spellcheck="false" data-1p-ignore="true" data-lpignore="true" data-bwignore="true" data-form-type="other">
    </label>
    <label>Nota (opcional)
      <input id="fNota" maxlength="80" placeholder="P. ej. Campeón olímpico · barra fija" autocomplete="off" data-1p-ignore="true" data-lpignore="true" data-bwignore="true" data-form-type="other">
    </label>
    <div class="error" id="fError" role="alert"></div>
    <div class="acciones">
      <button type="button" class="sec" id="fCancelar">Cancelar</button>
      <button type="submit" id="fGuardar">Guardar</button>
    </div>
  </form>
</div>

<script src="../../cliente/config.js"></script>
<script src="../../cliente/theme.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>
<script src="../../cliente/fuentes.js"></script>
<div class="modal oculto" id="modalVideo" role="dialog" aria-modal="true" aria-labelledby="mvTitulo">
  <form class="caja" id="formVideo" autocomplete="off">
    <h2 id="mvTitulo">Agregar video</h2>
    <label>Enlace del video (Instagram, TikTok o YouTube)
      <input id="vEnlace" required placeholder="https://www.instagram.com/reel/…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" data-1p-ignore="true" data-lpignore="true" data-bwignore="true" data-form-type="other">
    </label>
    <p class="ayuda">En la app de Instagram o TikTok: «Compartir» → «Copiar enlace», y pégalo aquí.</p>
    <div class="error" id="vError" role="alert"></div>
    <div class="acciones">
      <button type="button" class="sec" id="vCancelar">Cancelar</button>
      <button type="submit" id="vGuardar">Agregar</button>
    </div>
  </form>
</div>

<script src="app.js?v=4"></script>
<script src="videos.js?v=5"></script>
</body>
</html>
