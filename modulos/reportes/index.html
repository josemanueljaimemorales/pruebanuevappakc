<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta name="theme-color" content="#061426">
  <title>Reportes · AKC</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Segoe UI",Arial,sans-serif;background:#03080f;color:#f4f8fc}body{padding:20px;background:radial-gradient(circle at 20% 0%,rgba(43,157,255,.16),transparent 34%),linear-gradient(145deg,#03070d,#0b1420 55%,#04080f)}
    .wrap{width:min(900px,100%);margin:auto}.top{display:flex;align-items:center;gap:14px;padding:18px 20px;border:1px solid rgba(190,207,224,.2);border-radius:20px;background:linear-gradient(135deg,rgba(13,25,39,.94),rgba(5,10,17,.9));box-shadow:0 18px 50px rgba(0,0,0,.35)}
    .mark{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;background:rgba(43,157,255,.1);border:1px solid rgba(43,157,255,.25);font-size:25px}.eyebrow{font-size:10px;letter-spacing:.22em;color:#8fa5ba}.top h1{margin:3px 0 0;font-size:25px;letter-spacing:.08em}.intro{margin:22px 2px 12px;color:#8096aa;font-size:11px;letter-spacing:.16em;text-transform:uppercase}
    .card{display:flex;align-items:center;gap:16px;width:100%;padding:18px;border:1px solid rgba(190,207,224,.2);border-radius:18px;background:linear-gradient(135deg,rgba(31,44,59,.9),rgba(8,14,22,.94));color:#fff;text-align:left;cursor:pointer;box-shadow:0 12px 30px rgba(0,0,0,.25);transition:.16s}.card:hover{transform:translateY(-2px);border-color:rgba(201,170,98,.5)}.num{width:45px;height:45px;border-radius:13px;display:grid;place-items:center;background:rgba(201,170,98,.1);color:#c9aa62;font-weight:800}.card b{display:block;font-size:15px;letter-spacing:.06em}.card small{display:block;margin-top:4px;color:#8fa4b9;font-size:12px}.arrow{margin-left:auto;font-size:28px;color:#8298ac}.foot{margin-top:28px;text-align:center;color:#53687d;font-size:9px;letter-spacing:.22em}
  </style>
</head>
<body>
  <main class="wrap">
    <header class="top"><div class="mark">▥</div><div><div class="eyebrow">ÁGUILAS KC · REPORTES</div><h1>REPORTES</h1></div></header>
    <div class="intro">Módulos disponibles</div>
    <button class="card" onclick="location.href='estadisticas/index.html'"><span class="num">01</span><span><b>ESTADÍSTICAS DE COMPETENCIAS</b><small>Participantes, resultados y resumen de competencias</small></span><span class="arrow">›</span></button>
    <div class="foot">SISTEMA AKC</div>
  </main>
</body>
</html>
