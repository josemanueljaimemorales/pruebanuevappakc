<script>
const SCHEDULE={
 'GAV 3':[2,4],'GAV3':[2,4],
 'GAV4':[1,2,3,4,5],'GAV 4':[1,2,3,4,5],
 'GAV5':[1,2,3,4,5,6],'GAV 5':[1,2,3,4,5,6],
 'GAV6':[1,2,3,4,6],'GAV 6':[1,2,3,4,6],
 'GAV9':[1,2,3,4,5,6],'GAV 9':[1,2,3,4,5,6],
 'GAVFIG':[1,2,3,4,5,6],'GAV FIG':[1,2,3,4,5,6],
 'GAVFIGELITE':[1,2,3,4,5,6],'GAV ELITE':[1,2,3,4,5,6]
};
const groupNorm=s=>String(s||'').replace(/\s+/g,'').toUpperCase();
const scheduleForGroup=g=>{const n=groupNorm(g);if(n==='GAVELITE'||n==='GAVFIGELITE')return SCHEDULE.GAVFIGELITE;if(n==='GAV3')return SCHEDULE.GAV3;if(n==='GAV4')return SCHEDULE.GAV4;if(n==='GAV5')return SCHEDULE.GAV5;if(n==='GAV6')return SCHEDULE.GAV6;if(n==='GAV9')return SCHEDULE.GAV9;if(n==='GAVFIG')return SCHEDULE.GAVFIG;return [];};
const cleanGroup=s=>{const n=groupNorm(s);if(n==='GAV3')return'GAV 3';if(n==='GAV4')return'GAV4';if(n==='GAV5')return'GAV5';if(n==='GAV6')return'GAV6';if(n==='GAV9')return'GAV9';if(n==='GAVFIGELITE'||n==='GAVELITE')return'GAVFIG Elite';if(n==='GAVFIG')return'GAVFIG';return String(s||'').trim()};
const esc=s=>String(s??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]));
const $=id=>document.getElementById(id);
let records=[],summary=[],currentFile='',minDate=null,maxDate=null;
function parseDate(v){if(v instanceof Date)return v;if(typeof v==='number'&&Number.isFinite(v)){const d=new Date(Date.UTC(1899,11,30)+Math.round(v)*86400000);return new Date(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate())}const s=String(v??'').trim();let m=s.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);if(m)return new Date(+m[3],+m[2]-1,+m[1]);m=s.match(/^(\d{4})-(\d{2})-(\d{2})$/);if(m)return new Date(+m[1],+m[2]-1,+m[3]);return null}
function fmtDate(d){return d?d.toLocaleDateString('es-MX',{day:'numeric',month:'long',year:'numeric'}):'—'}
function fmtShort(d){return d?String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear():''}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function datesBetween(a,b,days){let c=0;for(let d=new Date(a);d<=b;d=addDays(d,1))if(days.includes(d.getDay()))c++;return c}
function groupOfEvent(e){const x=String(e||'').toUpperCase();if(x.includes('GAV 3'))return'GAV 3';if(x.includes('GAV 4'))return'GAV4';if(x.includes('GAV 5'))return'GAV5';if(x.includes('GAV 6'))return'GAV6';if(x.includes('GAV 9'))return'GAV9';if(x.includes('GAV ELITE'))return'GAVFIG Elite';if(x.includes('GAV FIG'))return'GAVFIG';return null}
function isDouble(e){return String(e||'').toUpperCase().startsWith('DOBLE SESION')}
function statusPresent(s){return String(s||'').toLowerCase().startsWith('present')}
function statusTardy(s){return String(s||'').toLowerCase().includes('tardy')}
function statusEarly(s){return String(s||'').toLowerCase().includes('left early')}
function parseRows(rows){
 const head=rows.findIndex(r=>String(r?.[0]||'').trim()==='Student');if(head<0)throw Error('No se encontró la fila Student en el Excel.');
 const out=[];for(let i=head+1;i<rows.length;i++){const r=rows[i]||[];const name=String(r[0]??'').trim(),date=parseDate(r[1]),event=String(r[3]??'').trim(),status=String(r[4]??'').trim();if(!name||!date||!event)continue;out.push({name,date,event,status,group:groupOfEvent(event),double:isDouble(event)});}return out;
}
function athleteGroups(arr){
 const by=new Map();arr.filter(x=>x.group&&!x.double).sort((a,b)=>a.date-b.date).forEach(x=>{if(!by.has(x.name))by.set(x.name,[]);const a=by.get(x.name);if(!a.length||a[a.length-1].group!==x.group)a.push({group:x.group,start:x.date,end:x.date});else a[a.length-1].end=x.date;});return by;
}
// Correcciones explícitas de trayectoria indicadas por el entrenador para el reporte actual.
const CURRENT_OVERRIDES={
 'Maximiliano Diaz Ayala':['GAV6','GAV9'],'Nicolas Capitanachi Vicenttin':['GAV6','GAV9'],'Luis Santiago Sigler Perez':['GAV6','GAV9'],
 'Mario Bisteni Marín':['GAV6','GAV9'],'Alfredo Jacobo Pimentel':['GAV6'],'Bruno Jacobo Pimentel':['GAV6','GAV9'],
 'Alonso Ahedo Carvallo':['GAV9','GAVFIG'],'Brittan Akim Robles Ceballos':['GAV6'],'Ricardo Antonio Jiménez Santos':['GAVFIG']
};
function pathFor(name,groups){if(CURRENT_OVERRIDES[name])return CURRENT_OVERRIDES[name];return groups.get(name)?.map(x=>x.group)||[]}
function compute(name,arr,groups){
 const mine=arr.filter(x=>x.name===name);if(!mine.length)return null;
 const normal=mine.filter(x=>!x.double&&x.group).sort((a,b)=>a.date-b.date);
 const first=normal[0]?.date||mine[0].date,last=normal[normal.length-1]?.date||mine[mine.length-1].date;
 let segments=groups.get(name)||[];
 if(CURRENT_OVERRIDES[name]){
  const path=CURRENT_OVERRIDES[name];
  if(path.length===1)segments=[{group:path[0],start:first,end:last}];
  else {
   const switchAt=new Date(first.getTime()+Math.floor((last-first)/2));
   segments=path.map((g,i)=>({group:g,start:i===0?first:switchAt,end:i===path.length-1?last:new Date(switchAt.getTime()-86400000)}));
  }
 }
 let expected=0;segments.forEach(s=>{expected+=datesBetween(s.start,s.end,scheduleForGroup(s.group))});
 const attendedNormal=normal.filter(x=>statusPresent(x.status)).length;
 const tardy=normal.filter(x=>statusTardy(x.status)).length;
 const early=normal.filter(x=>statusEarly(x.status)).length;
 const doubles=mine.filter(x=>x.double);
 const doubleAtt=doubles.filter(x=>statusPresent(x.status)).length;
 expected+=doubles.length;
 const attended=attendedNormal+doubleAtt;
 const absences=Math.max(0,expected-attended);
 return {name,groups:pathFor(name,groups),expected,attended,absences,attendance:expected>0?(attended/expected)*100:0,tardy,early,doubles:doubles.length,doubleAtt};
}
function groupSummary(list){
 const out=new Map();
 for(const r of list){const g=r.groups[r.groups.length-1]||'—';if(!out.has(g))out.set(g,{g,n:0,e:0,a:0});const x=out.get(g);x.n++;x.e+=r.expected;x.a+=r.attended;}
 return [...out.values()].map(x=>({...x,p:x.e>0?x.a/x.e*100:0}));
}
function semClass(p){return p>85?'row-green':p>=70?'row-yellow':'row-red'}
function pct(v){return Number.isFinite(v)?v.toFixed(1)+'%':'—'}
function buildPrintReport(){
 const totalExpected=summary.reduce((a,x)=>a+x.expected,0),totalAtt=summary.reduce((a,x)=>a+x.attended,0);
 const global=totalExpected>0?totalAtt/totalExpected*100:0,gsum=groupSummary(summary);
 const groupRows=gsum.map(x=>`<tr><td>${esc(x.g)}</td><td>${x.n}</td><td>${x.e.toLocaleString('es-MX')}</td><td class="pct ${semClass(x.p)}">${pct(x.p)}</td></tr>`).join('');
 const individual=summary.slice().sort((a,b)=>(b.attendance-a.attendance)||a.name.localeCompare(b.name,'es')).map((x,i)=>`<tr class="${semClass(x.attendance)}"><td>${i+1}</td><td>${esc(x.name)}</td><td>${esc(x.groups.join(' → '))}</td><td>${x.expected}</td><td>${x.attended}</td><td>${x.tardy}</td><td>${x.early}</td><td>${x.doubles||'—'}</td><td>${x.doubleAtt||'—'}</td><td class="pct">${pct(x.attendance)}</td></tr>`).join('');
 const allD=summary.filter(x=>x.doubles>0).map(x=>`${esc(x.name)} (${x.doubleAtt}/${x.doubles})`).join(' · ');
 $('printReport').innerHTML=`<div class="hero"><div class="heroHead"><div><div class="heroTitle">REPORTE DE ASISTENCIA</div><div class="heroSub">AKC · ÁGUILAS DE KIDS CENTER · GIMNASIA · ${esc(fmtDate(minDate))} al ${esc(fmtDate(maxDate))}</div></div><img class="heroLogo" src="../../../cliente/logo.png"></div><div class="metrics"><div class="metric"><small>Atletas</small><strong>${summary.length}</strong></div><div class="metric"><small>Asistencia general</small><strong>${pct(global)}</strong></div><div class="metric"><small>Sesiones esperadas</small><strong>${totalExpected.toLocaleString('es-MX')}</strong></div><div class="metric"><small>Sesiones asistidas</small><strong>${totalAtt.toLocaleString('es-MX')}</strong></div><div class="metric"><small>Dobles registradas</small><strong>${summary.reduce((a,x)=>a+x.doubles,0)}</strong></div></div><div class="groupBox"><div class="boxTitle">Resumen por grupo</div><table class="groupTable"><thead><tr><th>Grupo</th><th>Atletas</th><th>Sesiones programadas</th><th>% asistencia</th></tr></thead><tbody>${groupRows}</tbody></table></div><div class="groupBox"><div class="boxTitle">Días de entrenamiento considerados</div><div class="days">GAV3: martes y jueves · GAV4: lunes a viernes · GAV5: lunes a sábado · GAV6: lunes a jueves y sábado · GAV9: lunes a sábado · GAVFIG: lunes a sábado · GAVFIG Elite: lunes a sábado.</div></div><div class="noteBox"><b>Semáforo:</b> VERDE · más de 85% · AMARILLO · 70% a 84.9% · ROJO · menos de 69.9%.<br><b>Lesiones:</b> si el atleta asiste con entrenamiento modificado por lesión, cuenta como presente. Si no asiste, la sesión se registra como falta aunque la causa sea una lesión.<br><b>Importante:</b> retardos y salidas antes son informativos y no modifican el porcentaje.</div><div class="tableBox"><div class="boxTitle">Asistencia individual · todos los atletas</div><table class="individual"><thead><tr><th>#</th><th>Atleta</th><th>Grupo</th><th>Esperadas</th><th>Asistidas</th><th>Retardos</th><th>Salidas</th><th>Dobles incluidas</th><th>Dobles asistidas</th><th>Asistencia</th></tr></thead><tbody>${individual}</tbody></table></div><div class="groupBox"><div class="boxTitle">Dobles asistidas (asistidas/registradas)</div><div class="doubleText">${allD||'No hay dobles registradas.'}</div></div></div>`;
}
function render(){
 const name=$('athlete').value;
 if(!name){$('report').classList.add('hidden');$('printBtn').disabled=true;return;}
 const groups=athleteGroups(records),r=compute(name,records,groups);if(!r)return;
 const current=r.groups[r.groups.length-1]||'—';
 $('report').innerHTML=`<div class="hero"><div class="heroHead"><div><div class="heroTitle">REPORTE INDIVIDUAL DE ASISTENCIA</div><div class="heroSub">AKC · ÁGUILAS DE KIDS CENTER · ${esc(fmtDate(minDate))} al ${esc(fmtDate(maxDate))}</div></div><img class="heroLogo" src="../../../cliente/logo.png"></div><div class="metrics"><div class="metric"><small>Asistencia</small><strong>${pct(r.attendance)}</strong></div><div class="metric"><small>Sesiones esperadas</small><strong>${r.expected}</strong></div><div class="metric"><small>Sesiones asistidas</small><strong>${r.attended}</strong></div><div class="metric"><small>Faltas</small><strong>${r.absences}</strong></div><div class="metric"><small>Retardos</small><strong>${r.tardy}</strong></div><div class="metric"><small>Salidas antes</small><strong>${r.early}</strong></div><div class="metric"><small>Dobles incluidas</small><strong>${r.doubles||'—'}</strong></div><div class="metric"><small>Dobles asistidas</small><strong>${r.doubleAtt||'—'}</strong></div><div class="metric"><small>Grupo actual</small><strong style="font-size:16px">${esc(current)}</strong></div></div><div class="groupBox"><div class="boxTitle">Trayectoria de grupo</div><div class="days">${esc(r.groups.join(' → ')||'Sin grupo identificado')}</div></div><div class="groupBox"><div class="boxTitle">Días de entrenamiento considerados</div><div class="days">GAV3: martes y jueves · GAV4: lunes a viernes · GAV5: lunes a sábado · GAV6: lunes a jueves y sábado · GAV9: lunes a sábado · GAVFIG: lunes a sábado · GAVFIG Elite: lunes a sábado.</div></div><div class="noteBox"><b>Semáforo:</b> VERDE · más de 85% · AMARILLO · 70% a 84.9% · ROJO · menos de 69.9%.<br><b>Lesiones:</b> si el atleta asiste con entrenamiento modificado por lesión, cuenta como presente. Si no asiste, la sesión se registra como falta aunque la causa sea una lesión.<br><b>Importante:</b> retardos y salidas antes son informativos y no modifican el porcentaje.</div></div>`;
 $('report').classList.remove('hidden');$('printBtn').disabled=false;
}
function parseFilenameDate(name){const m=String(name).match(/Student Attendance Report\s+(\d{2})-(\d{2})-(\d{4})\.xlsx$/i);return m?new Date(+m[3],+m[2]-1,+m[1]):null}
async function findLatestFile(){
 // En GitHub Pages, buscamos todos los archivos del directorio del repositorio. En copias locales usamos el archivo conocido como respaldo.
 const fallback='Student Attendance Report 08-10-2026.xlsx';
 const candidates=[];
 try{
  const path=location.pathname.split('/').filter(Boolean);const host=location.hostname;
  if(host.endsWith('github.io')){
   const user=host.split('.')[0];
   const first=path[0]||'';
   const repo=(first && first!=='modulos' && first!=='index.html')?first:`${user}.github.io`;
   const api=`https://api.github.com/repos/${encodeURIComponent(user)}/${encodeURIComponent(repo)}/contents/modulos/reportes/asistencia`;
   const res=await fetch(api,{cache:'no-cache'});
   if(res.ok){const list=await res.json();list.filter(x=>x.type==='file').forEach(x=>{const d=parseFilenameDate(x.name);if(d)candidates.push({name:x.name,date:d,url:x.download_url})});}
  }
 }catch(e){console.warn('No se pudo consultar el listado remoto de asistencia:',e)}
 if(!candidates.length){const d=parseFilenameDate(fallback);return {name:fallback,date:d,url:fallback}}
 candidates.sort((a,b)=>b.date-a.date);return candidates[0];
}
async function init(){try{const latest=await findLatestFile();currentFile=latest.name;const rows=await AKC_XLSX.read(latest.url);records=parseRows(rows);if(!records.length)throw Error('El Excel no contiene registros de asistencia.');minDate=records.reduce((m,x)=>!m||x.date<m?x.date:m,null);maxDate=records.reduce((m,x)=>!m||x.date>m?x.date:m,null);const groups=athleteGroups(records);summary=[...new Set(records.map(x=>x.name))].sort((a,b)=>a.localeCompare(b,'es')).map(n=>compute(n,records,groups)).filter(Boolean);$('athlete').innerHTML='<option value="">Selecciona un atleta...</option>'+summary.map(x=>`<option value="${esc(x.name)}">${esc(x.name)}</option>`).join('');$('period').innerHTML=`Periodo del reporte: <b>${esc(fmtDate(minDate))} al ${esc(fmtDate(maxDate))}</b>`;$('status').textContent=`Archivo activo: ${currentFile}`;$('athlete').onchange=render;buildPrintReport();$('printBtn').onclick=printReportToPdf;}catch(e){console.error(e);$('status').textContent='No se pudo cargar el reporte de asistencia: '+e.message}}




async function printReportToPdf(){
  const source=$('printReport');
  if(!source||!source.innerHTML.trim()){
    alert('El resumen general todavía no está listo. Espera a que termine de cargar.');
    return;
  }
  if(typeof html2pdf!=='function'){
    alert('No se pudo cargar el generador de PDF. Comprueba tu conexión e inténtalo de nuevo.');
    return;
  }
  const button=$('printBtn');
  const oldLabel=button.textContent;
  button.disabled=true;
  button.textContent='GENERANDO PDF…';

  const stage=document.createElement('div');
  stage.style.cssText='position:fixed;left:-15000px;top:0;width:194mm;background:#fff;color:#17243b;z-index:-1;overflow:visible;';
  const clone=source.cloneNode(true);
  clone.style.cssText='display:block!important;visibility:visible!important;width:194mm!important;max-width:194mm!important;margin:0!important;padding:0!important;background:#fff!important;color:#17243b!important;font-family:Arial,Helvetica,sans-serif!important;overflow:visible!important;box-sizing:border-box!important;';

  // Cambios exclusivos del PDF: quitar sesiones programadas del resumen grupal.
  const groupTable=clone.querySelector('.groupTable');
  if(groupTable){
    groupTable.querySelectorAll('tr').forEach(tr=>{
      if(tr.children.length>=4) tr.removeChild(tr.children[2]);
    });
  }

  // Corregir el ancho de la tabla individual y enfatizar porcentajes.
  const individual=clone.querySelector('.individual');
  if(individual){
    individual.style.cssText='width:100%!important;min-width:0!important;max-width:100%!important;table-layout:fixed!important;border-collapse:collapse!important;';
    const widths=['4%','22%','13%','8%','8%','6%','6%','9%','12%','12%'];
    individual.querySelectorAll('tr').forEach(tr=>{
      [...tr.children].forEach((cell,i)=>{
        cell.style.setProperty('width',widths[i]||'8%','important');
        cell.style.setProperty('padding','2px 1.5px','important');
        cell.style.setProperty('font-size','6.8pt','important');
        cell.style.setProperty('overflow-wrap','anywhere','important');
        cell.style.setProperty('word-break','normal','important');
      });
      if(tr.children.length>=10){
        const pctCell=tr.children[9];
        pctCell.style.setProperty('font-weight','900','important');
      }
    });
    individual.querySelectorAll('tbody tr td:last-child').forEach(td=>{
      td.style.setProperty('font-weight','900','important');
    });
  }
  // Porcentajes grupales en negritas y anchos ajustados después de quitar la tercera columna.
  if(groupTable){
    groupTable.style.cssText='width:100%!important;table-layout:fixed!important;border-collapse:collapse!important;';
    groupTable.querySelectorAll('tr').forEach(tr=>{
      [...tr.children].forEach((cell,i)=>{
        cell.style.setProperty('width',['40%','20%','40%'][i]||'','important');
        cell.style.setProperty('padding','4px 5px','important');
      });
      if(tr.children.length===3){
        tr.lastElementChild.style.setProperty('font-weight','900','important');
      }
    });
  }

  const style=document.createElement('style');
  style.textContent=`
    #printReport, #printReport * { box-sizing:border-box !important; }
    #printReport { background:#fff !important; color:#17243b !important; width:194mm !important; }
    #printReport .hero, #printReport .heroHead, #printReport .metrics,
    #printReport .groupBox, #printReport .tableBox, #printReport .noteBox {
      background:#fff !important; color:#17243b !important;
    }
    #printReport .boxTitle { background:#f1f5f9 !important; color:#17243b !important; }
    #printReport table { max-width:100% !important; }
    #printReport th, #printReport td { overflow-wrap:anywhere !important; }
    #printReport .groupTable tbody td:last-child,
    #printReport .individual tbody td:last-child,
    #printReport .metric strong { font-weight:900 !important; }
    #printReport .row-green { background:#dceedd !important; }
    #printReport .row-yellow { background:#fff1c7 !important; }
    #printReport .row-red { background:#f6dada !important; }
    #printReport img { max-width:100% !important; }
  `;
  stage.appendChild(style);
  stage.appendChild(clone);
  document.body.appendChild(stage);

  try{
    const images=[...clone.querySelectorAll('img')];
    await Promise.all(images.map(img=>{
      if(img.complete) return Promise.resolve();
      return new Promise(resolve=>{img.onload=resolve;img.onerror=resolve;setTimeout(resolve,2500)});
    }));
    const filename='Reporte_Asistencia_AKC_'+(minDate&&maxDate?(fmtShort(minDate).replace(/\//g,'-')+'_'+fmtShort(maxDate).replace(/\//g,'-')):'general')+'.pdf';
    await html2pdf().set({
      margin:[7,7,7,7],
      filename,
      image:{type:'jpeg',quality:0.98},
      html2canvas:{scale:2,useCORS:true,backgroundColor:'#ffffff',logging:false,scrollX:0,scrollY:0,windowWidth:clone.scrollWidth},
      jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},
      pagebreak:{mode:['css','legacy'],before:'.tableBox',avoid:['.groupBox','.noteBox','tr']}
    }).from(clone).save();
  }catch(e){
    console.error('Error al generar el PDF de asistencia:',e);
    alert('No se pudo generar el PDF. Inténtalo de nuevo.');
  }finally{
    stage.remove();
    button.disabled=false;
    button.textContent=oldLabel;
  }
}

init();
</script>
