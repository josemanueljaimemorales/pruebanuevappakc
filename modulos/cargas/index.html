<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#061426">
  <title>Control de Entrenamiento</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <div class="eagle-bg" aria-hidden="true"></div>
    <header class="hero">
      <div class="brand-mark"><img src="../../cliente/logo.png" data-cliente-logo alt="Logo del cliente"></div>
      <div class="brand-copy">
        <span class="eyebrow"><span data-cliente-name></span></span>
        <h1>Cargas</h1>
        <p>Control de entrenamiento</p>
      </div>
      <div class="status"><span></span> SISTEMA ACTIVO</div>
    </header>

    <main>
      <section class="menu-panel">
        <div class="panel-heading">
          <span>Panel de trabajo</span>
          <small>Selecciona un módulo</small>
        </div>
        <div class="botones">
          <button onclick="mostrar('obligatorios')"><span class="num">01</span><span><b>Niveles Obligatorios</b><small>Rutinas y requerimientos</small></span><i>→</i></button>
          <button onclick="mostrar('sistemas')"><span class="num">02</span><span><b>Sistemas (Niveles Libres)</b><small>Trabajo de fuerza y sistemas</small></span><i>→</i></button>
          <button onclick="mostrar('semanal')"><span class="num">03</span><span><b>Trabajo Semanal (Libres)</b><small>Planeación de la semana</small></span><i>→</i></button>
          <button class="coach" onclick="login()"><span class="num">04</span><span><b>Edición Entrenador</b><small>Acceso de edición</small></span><i>→</i></button>
        </div>
      </section>
      <section id="contenido" class="fade"></section>
    </main>

    <footer><span><span data-cliente-name></span></span><span>GIMNASIA ARTÍSTICA VARONIL</span></footer>
  </div>

  <script src="../../cliente/config.js"></script>
<script src="../../cliente/theme.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="app.js"></script>
</body>
</html>
