<style>
:root{--navy:#081b33;--blue:#1167d8;--cyan:#13b9c8;--bg:#f4f7fb;--line:#e5ebf2;--muted:#68778a;--good:#0b8f63;--danger:#c24141}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial;background:var(--bg);color:#142033}.header{background:linear-gradient(135deg,var(--navy),#0c3c72 58%,#0c7b91);color:#fff;padding:22px 24px;position:sticky;top:0;z-index:10;box-shadow:0 5px 22px #06152a22}.brand{display:flex;align-items:center;gap:13px;max-width:1180px;margin:auto}.logo{width:46px;height:46px;border-radius:13px;background:#fff;color:var(--navy);display:grid;place-items:center;font-weight:900;font-size:20px;box-shadow:0 5px 14px #0003}.brand b{font-size:20px}.brand span{display:block;font-size:12px;opacity:.75;margin-top:2px}.wrap{max-width:1180px;margin:25px auto;padding:0 18px}.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:18px}.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:800;cursor:pointer;background:var(--navy);color:#fff}.btn.alt{background:#fff;color:var(--navy);border:1px solid var(--line)}.btn.blue{background:var(--blue)}.hero{background:#fff;border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:0 10px 30px #0b234008;margin-bottom:18px}.eyebrow{font-size:12px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--blue)}h1{margin:5px 0 7px;font-size:32px}h2{margin:0 0 12px}p{color:var(--muted);margin:4px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:17px;box-shadow:0 7px 20px #10243b08}.eventcard{cursor:pointer;transition:.18s}.eventcard:hover{transform:translateY(-2px);box-shadow:0 14px 28px #10243b15}.eventtop{display:flex;justify-content:space-between;align-items:center}.trophy{font-size:28px}.count{background:#e9f2ff;color:var(--blue);padding:6px 9px;border-radius:99px;font-size:12px;font-weight:900}.search{width:100%;padding:14px 16px;border:1px solid var(--line);border-radius:13px;font-size:15px;outline:none}.search:focus{border-color:var(--blue);box-shadow:0 0 0 3px #1167d815}.atlete{cursor:pointer;transition:.16s}.atlete:hover{border-color:#b9d2f4;transform:translateY(-1px)}.name{font-weight:900;font-size:18px}.meta{font-size:12px;color:var(--muted);margin-top:4px}.aa{font-size:25px;font-weight:950;margin-top:14px}.rank{display:inline-block;margin-top:9px;background:#eaf8f4;color:var(--good);font-weight:900;font-size:12px;padding:5px 8px;border-radius:8px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}.stat{background:#f7faff;border:1px solid var(--line);border-radius:13px;padding:13px}.stat small{display:block;color:var(--muted);font-weight:700;font-size:11px}.stat strong{display:block;font-size:20px;margin-top:4px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:16px;background:#fff}table{border-collapse:collapse;width:100%;min-width:720px}th,td{padding:12px 10px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}th{background:#f5f8fc;color:#536274;font-size:11px;text-transform:uppercase;letter-spacing:.05em}th:first-child,td:first-child{text-align:left;font-weight:900}tr:last-child td{border-bottom:0}.npd{color:#536274;font-weight:800}.nf{font-weight:900;color:#0d355c}.no{color:var(--danger);font-weight:900;text-align:center}.sub{color:var(--muted);font-size:12px}.back{margin-bottom:12px}.drop{border:2px dashed #bdd0e6;border-radius:17px;padding:18px;text-align:center;background:#fbfdff;color:#64748b;cursor:pointer}.drop input{display:none}.hidden{display:none!important}.pill{padding:6px 9px;border-radius:8px;background:#eef4fb;color:#44556a;font-size:12px;font-weight:900}@media(max-width:720px){.stats{grid-template-columns:repeat(2,1fr)}h1{font-size:26px}.wrap{margin-top:16px;padding:0 12px}}
</style></head><body><header class="header"><div class="brand"><div class="logo">AKC</div><div><b>Águilas Kids Center</b><span>RESULTADOS · HISTORIAL DE COMPETENCIAS</span></div></div></header><main class="wrap"><div id="app"></div></main>
<script>
let DATA={"event": "NACIONAL 2026", "apparatus": ["Piso", "Arzón", "Anillos", "Salto", "Paralelas", "Barra Fija"], "athletes": [{"name": "YERIK", "level": 7, "objective": 72, "dif": -7.001999999999995, "aa": 64.998, "effectiveness": 0.8869271983880992, "excelPlace": 1, "routine": "LIBRES", "apparatus": [{"name": "Piso", "np": 12.3, "nf": 11.2}, {"name": "Arzón", "np": 12.1, "nf": 10.666}, {"name": "Anillos", "np": 12.2, "nf": 11.2}, {"name": "Salto", "np": 12.4, "nf": 10.033}, {"name": "Paralelas", "np": 12.2, "nf": 11.033}, {"name": "Barra Fija", "np": 12.1, "nf": 10.866}], "desired": [12.3, 12.1, 12.2, 12.4, 12.2, 12.1]}, {"name": "MIKEL", "level": 9, "objective": 70, "dif": -6.635000000000005, "aa": 63.364999999999995, "effectiveness": 0.8443450843663912, "excelPlace": 2, "routine": null, "apparatus": [{"name": "Piso", "np": 12.8, "nf": 11.2}, {"name": "Arzón", "np": 11.9, "nf": 9.7}, {"name": "Anillos", "np": 12.8, "nf": 10.733}, {"name": "Salto", "np": 12.8, "nf": 11.133}, {"name": "Paralelas", "np": 12.3, "nf": 9.966}, {"name": "Barra Fija", "np": 12.3, "nf": 10.633}], "desired": [12.8, 12.1, 12.8, 12.8, 12.1, 12.4]}, {"name": "RICHIE", "level": 10, "objective": 72, "dif": -3.402000000000001, "aa": 68.598, "effectiveness": 0.8410731889423577, "excelPlace": 3, "routine": null, "apparatus": [{"name": "Piso", "np": 14.2, "nf": 11.933}, {"name": "Arzón", "np": 13.8, "nf": 11.233}, {"name": "Anillos", "np": 13.1, "nf": 11.366}, {"name": "Salto", "np": 13.6, "nf": 10.933}, {"name": "Paralelas", "np": 13.2, "nf": 11.1}, {"name": "Barra Fija", "np": 13.5, "nf": 12.033}], "desired": [14.4, 13.799999999999999, 13.1, 13.6, 13.2, 13.5]}, {"name": "VELA", "level": 8, "objective": 72, "dif": -7.067999999999998, "aa": 64.932, "effectiveness": 0.840043261878072, "excelPlace": 4, "routine": null, "apparatus": [{"name": "Piso", "np": 13.3, "nf": 11.866}, {"name": "Arzón", "np": 12.6, "nf": 9.9}, {"name": "Anillos", "np": 12.8, "nf": 10.5}, {"name": "Salto", "np": 12.4, "nf": 10.8}, {"name": "Paralelas", "np": 13.2, "nf": 11}, {"name": "Barra Fija", "np": 12.7, "nf": 10.866}], "desired": [13.3, 13, 12.899999999999999, 12.4, 12.9, 12.8]}, {"name": "DIEGO", "level": 10, "objective": 72, "dif": -23.367999999999995, "aa": 48.632000000000005, "effectiveness": 0.8274367945186629, "excelPlace": 5, "routine": null, "apparatus": [{"name": "Piso", "np": 0.1, "nf": 0}, {"name": "Arzón", "np": 14.6, "nf": 12.133}, {"name": "Anillos", "np": 14.5, "nf": 13.233}, {"name": "Salto", "np": 0.1, "nf": 0}, {"name": "Paralelas", "np": 14.5, "nf": 12.2}, {"name": "Barra Fija", "np": 14.1, "nf": 11.066}], "desired": [15, 14.9, 14.6, 13.799999999999999, 14.5, 14.8]}, {"name": "ISAAC", "level": 9, "objective": 70, "dif": -8.835, "aa": 61.165, "effectiveness": 0.8206081912277081, "excelPlace": 6, "routine": null, "apparatus": [{"name": "Piso", "np": 12.4, "nf": 10.3}, {"name": "Arzón", "np": 12, "nf": 9.566}, {"name": "Anillos", "np": 12.4, "nf": 10.666}, {"name": "Salto", "np": 12, "nf": 10.3}, {"name": "Paralelas", "np": 12.2, "nf": 10.9}, {"name": "Barra Fija", "np": 12.6, "nf": 9.433}], "desired": [12.5, 12.2, 12.9, 12, 12.2, 12.8]}, {"name": "FER", "level": 7, "objective": 68, "dif": -8.600999999999992, "aa": 59.39900000000001, "effectiveness": 0.8058156844788966, "excelPlace": 7, "routine": null, "apparatus": [{"name": "Piso", "np": 12.3, "nf": 10.666}, {"name": "Arzón", "np": 12.1, "nf": 10.233}, {"name": "Anillos", "np": 12.2, "nf": 11.1}, {"name": "Salto", "np": 12.2, "nf": 9}, {"name": "Paralelas", "np": 12.3, "nf": 9.8}, {"name": "Barra Fija", "np": 12.2, "nf": 8.6}], "desired": [12.4, 12.3, 12.2, 12.2, 12.4, 12.2]}, {"name": "ALONSO", "level": 10, "objective": 72, "dif": -10.835, "aa": 61.165, "effectiveness": 0.8023439620305216, "excelPlace": 8, "routine": null, "apparatus": [{"name": "Piso", "np": 14.2, "nf": 11.7}, {"name": "Arzón", "np": 8.4, "nf": 5.433}, {"name": "Anillos", "np": 12.5, "nf": 10.666}, {"name": "Salto", "np": 13.6, "nf": 11.733}, {"name": "Paralelas", "np": 13, "nf": 10.733}, {"name": "Barra Fija", "np": 13, "nf": 10.9}], "desired": [14.3, 11.6, 12.9, 13.6, 13, 13]}, {"name": "CHAMPI", "level": 9, "objective": 70, "dif": -70, "aa": 0, "effectiveness": 0, "excelPlace": null, "routine": null, "apparatus": [{"name": "Piso", "np": 0.1, "nf": 0}, {"name": "Arzón", "np": 0.1, "nf": 0}, {"name": "Anillos", "np": 0.1, "nf": 0}, {"name": "Salto", "np": 0.1, "nf": 0}, {"name": "Paralelas", "np": 0.1, "nf": 0}, {"name": "Barra Fija", "np": 0.1, "nf": 0}], "desired": [13.4, 11.799999999999999, 12.5, 11.8, 12.2, 13]}]};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const fmt=n=>(n===null||n===undefined||n===""||Number.isNaN(Number(n)))?"—":Number(n).toFixed(3);
const pct=n=>(n===null||n===undefined||Number.isNaN(Number(n)))?"—":(Number(n)*100).toFixed(2)+"%";
const num=n=>Number(n||0);
const presented=x=>num(x.nf)>0;
function calc(a){const rows=a.apparatus.map((x,i)=>{let p=presented(x),d=a.desired?a.desired[i]:null,ded=p?num(x.np)-num(x.nf):null,pc=p&&num(x.np)>0?num(x.nf)/num(x.np)*100:null;return {...x,desired:d,presented:p,ded,p:pc}});const v=rows.filter(x=>x.presented&&x.p!==null);const eff=v.length?v.reduce((s,x)=>s+x.p,0)/v.length/100:0;const aa=rows.filter(x=>x.presented).reduce((s,x)=>s+num(x.nf),0);return {rows,eff,aa}}
function recomputeRanks(){let e=DATA.athletes.map(a=>({a,c:calc(a)})).filter(x=>x.c.aa>0).sort((a,b)=>b.c.aa-a.c.aa),last=null,rank=0;e.forEach((x,i)=>{if(x.c.aa!==last){rank=i+1;last=x.c.aa}x.a.clubRank=rank})}
function home(){$('app').innerHTML=`<section class="hero"><div class="eyebrow">Módulo de resultados</div><h1>Competencias</h1><p>Cada Excel genera una competencia independiente y conserva su historial.</p></section><div class="toolbar"><button class="btn blue" onclick="document.getElementById('file').click()">＋ Subir Excel de resultados</button><input id="file" type="file" accept=".xlsx,.xls" class="hidden" onchange="importExcel(this.files[0])"></div><div class="drop" onclick="document.getElementById('file').click()">Arrastra aquí un Excel o toca para seleccionarlo.<br><span class="sub">Detecta el evento desde la esquina superior izquierda.</span></div><div style="height:18px"></div><div class="grid"><div class="card eventcard" onclick="eventView()"><div class="eventtop"><div class="trophy">🏆</div><span class="count">${DATA.athletes.length} atletas</span></div><h2>${esc(DATA.event)}</h2><p>Resultados del evento · Ranking interno AKC</p></div></div>`}
function eventView(){recomputeRanks();$('app').innerHTML=`<div class="back"><button class="btn alt" onclick="home()">← Competencias</button></div><section class="hero"><div class="eyebrow">Competencia</div><h1>🏆 ${esc(DATA.event)}</h1><p>${DATA.athletes.length} atletas cargados · El ranking mostrado es exclusivamente AKC.</p></section><input class="search" id="q" placeholder="Buscar atleta..." oninput="renderAthletes(this.value)"><div style="height:16px"></div><div class="grid" id="athletes"></div>`;renderAthletes('')}
function renderAthletes(q){let qq=(q||'').toLowerCase(),list=DATA.athletes.filter(a=>a.name.toLowerCase().includes(qq));$('athletes').innerHTML=list.map(a=>{let c=calc(a);return `<div class="card atlete" onclick="detail(${JSON.stringify(a.name)})"><div class="name">${esc(a.name)}</div><div class="meta">Nivel ${esc(a.level)}${a.routine?' · '+esc(a.routine):''}</div><div class="aa">${fmt(c.aa)} <span class="sub">AA</span></div>${a.clubRank?`<span class="rank">Ranking AKC · ${a.clubRank}.º</span>`:''}</div>`}).join('')||'<div class="card">No hay coincidencias.</div>'}
function detail(name){let a=DATA.athletes.find(x=>x.name===name);if(!a)return;let c=calc(a),diff=a.objective!==null&&a.objective!==undefined?c.aa-num(a.objective):null,participants=DATA.athletes.filter(x=>calc(x).aa>0).length;$('app').innerHTML=`<div class="back"><button class="btn alt" onclick="eventView()">← ${esc(DATA.event)}</button></div><section class="hero"><div class="eyebrow">${esc(DATA.event)}</div><h1>${esc(a.name)}</h1><p>Nivel ${esc(a.level)}${a.routine?' · Rutina '+esc(a.routine):''}</p><div class="stats"><div class="stat"><small>Objetivo AA</small><strong>${fmt(a.objective)}</strong></div><div class="stat"><small>All Around</small><strong>${fmt(c.aa)}</strong></div><div class="stat"><small>Diferencia</small><strong>${diff===null?'—':fmt(diff)}</strong></div><div class="stat"><small>Efectividad general</small><strong>${pct(c.eff)}</strong></div></div><div style="margin-top:14px"><span class="pill">Ranking AKC: ${a.clubRank?a.clubRank+'.º de '+participants+' participantes':'No clasifica'}</span></div></section><section class="card"><h2>Resultados por aparato</h2><p style="margin-bottom:14px">La NP deseada se toma de la segunda hoja cuando existe.</p><div class="tablewrap"><table><thead><tr><th>Aparato</th><th>NP deseada</th><th>NP real</th><th>NF</th><th>DED</th><th>%</th></tr></thead><tbody>${c.rows.map(x=>x.presented?`<tr><td>${esc(x.name)}</td><td class="npd">${fmt(x.desired)}</td><td>${fmt(x.np)}</td><td class="nf">${fmt(x.nf)}</td><td>${fmt(x.ded)}</td><td><b>${x.p.toFixed(2)}%</b></td></tr>`:`<tr><td>${esc(x.name)}</td><td class="npd">${fmt(x.desired)}</td><td>${fmt(x.np)}</td><td class="no">NO PRESENTÓ</td><td>—</td><td>—</td></tr>`).join('')}</tbody></table></div></section><div style="height:16px"></div><section class="card"><h2>Resumen</h2><p>El ranking AKC se calcula entre los atletas del club presentes en este archivo, por AA, y no utiliza el lugar oficial de la competencia.</p></section>`}
async function importExcel(file){if(!file)return;try{let buf=await file.arrayBuffer(),wb=XLSX.read(buf,{type:'array'}),s3=wb.Sheets[wb.SheetNames.find(n=>n.toLowerCase().includes('hoja3'))||wb.SheetNames[0]],s2=wb.Sheets[wb.SheetNames.find(n=>n.toLowerCase().includes('hoja2'))||wb.SheetNames[1]],r3=XLSX.utils.sheet_to_json(s3,{header:1,defval:null}),r2=XLSX.utils.sheet_to_json(s2,{header:1,defval:null}),event=r3[0]?.[0]||file.name.replace(/\.xlsx?$/i,''),names=['Piso','Arzón','Anillos','Salto','Paralelas','Barra Fija'],npcs=[4,6,8,10,12,14],nfcs=[5,7,9,11,13,15],ats=[];for(let r=3;r<r3.length;r+=2){let row=r3[r];if(!row||!row[0])continue;ats.push({name:String(row[0]),level:row[1],objective:row[2],dif:row[3],aa:row[16],effectiveness:row[17],excelPlace:row[18],routine:row[19],apparatus:names.map((n,i)=>({name:n,np:row[npcs[i]],nf:row[nfcs[i]]}))})}let st=r2.findIndex(r=>String(r?.[1]??'').trim().toUpperCase()==='NOTAS DE PARTIDA DESEADAS'),des={};if(st>=0)for(let r=st+1;r<r2.length;r++){let n=r2[r]?.[1];if(!n||typeof n!=='string')continue;des[normJS(n)]=r2[r].slice(2,8)}function gd(n){let k=normJS(n);if(des[k])return des[k];let q=Object.keys(des).find(x=>x.startsWith(k)||k.startsWith(x)||x.includes(k)||k.includes(x));return q?des[q]:null}ats.forEach(a=>a.desired=gd(a.name));DATA={event,apparatus:names,athletes:ats};home();alert('Competencia cargada: '+event)}catch(e){alert('No se pudo leer el Excel. Verifica la estructura de Hoja2 y Hoja3.\\n\\n'+e.message)}}
function normJS(s){return String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/[^A-Z0-9]+/g,' ').trim()}home();
</script></body></html>
